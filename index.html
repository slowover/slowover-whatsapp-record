<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V92.00</title>
    <style>
        :root { --primary: #D4A373; --bg: #FAF7F2; --text: #5F4B32; --accent: #8EAD91; --blue: #5C7CFA; --red: #E03131; --green: #25D366; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px 15px 120px 15px; }
        .card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; border-top: 1px solid #EEE; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .nav-item { flex: 1; padding: 15px 0; text-align: center; font-size: 11px; color: #BBB; font-weight: bold; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; max-width: 600px; margin: 0 auto; }
        .page.active { display: block; }
        input, textarea, button, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #E0D7CC; border-radius: 12px; font-size: 14px; }
        .item-row { background: #FDFBFA; padding: 12px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #F0E6D8; }
        .buy-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #EEE; }
        .buy-item.is-bought { opacity: 0.4; background: #F0F0F0; text-decoration: line-through; }
        .status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
        #copy-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; padding: 20px; border-radius: 25px; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10000; }
    </style>
</head>
<body>

    <div id="loading"><div>⏳ 正在讀取雲端數據...</div></div>

    <div id="copy-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">📋 訂單通知文案</h3>
            <textarea id="copy-area" readonly style="height: 300px; font-size: 13px;"></textarea>
            <button onclick="copyToClipboard()" style="background:var(--green); margin-top:10px;">一鍵複製</button>
            <button onclick="closeModal()" style="background:#EEE; color:#666; margin-top:5px;">關閉</button>
        </div>
    </div>

    <div id="page-main" class="page active">
        <div class="card">
            <h3>📝 新增訂單</h3>
            <input type="date" id="order-date">
            <input type="tel" id="cust-tel" placeholder="客戶電話">
            <div id="new-items-area"></div>
            <button onclick="addInputRow()" style="background:#F1F3F5; color:#666; border:1px dashed #CCC;">+ 增加商品</button>
            <textarea id="order-rem" placeholder="📍 送貨地址 / 備註"></textarea>
            <div id="total-display" style="text-align:right; font-weight:900; color:var(--red); padding:10px 0; font-size:20px;">總計: $0</div>
            <button onclick="saveOrder()" style="background:var(--accent); height:55px;">💾 儲存並同步</button>
        </div>
        <div id="order-list"></div>
    </div>

    <div id="page-buy" class="page">
        <div class="card">
            <h3>🛍️ 採購管理</h3>
            <input type="text" id="buy-search" placeholder="🔍 搜尋商品名稱..." oninput="renderBuy()">
            <select id="buy-filter" onchange="renderBuy()">
                <option value="all">顯示全部</option>
                <option value="pending">只顯示「未買❌」</option>
                <option value="bought">只顯示「已買✅」</option>
            </select>
            <div id="buy-summary" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="page-fx" class="page">
        <div class="card">
            <h3>💹 匯率助手設定</h3>
            <select id="fx-from"><option value="GBP">GBP 英鎊</option><option value="JPY">JPY 日圓</option></select>
            <input type="number" id="fx-rate" step="0.01" placeholder="匯率">
            <input type="number" id="fx-fee" placeholder="手續費 %">
            <button onclick="saveFX()">💾 儲存設定</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchPage('main', this)">📝 訂單</div>
        <div class="nav-item" onclick="switchPage('buy', this)">🛍️ 採購</div>
        <div class="nav-item" onclick="switchPage('fx', this)">💹 匯率</div>
    </nav>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec"; 
        let rawData = [], settings = {from:'GBP', rate:10.2, fee:0}, serial = 402;

        window.onload = () => {
            document.getElementById('order-date').valueAsDate = new Date();
            addInputRow();
            syncFromCloud();
        };

        async function syncFromCloud() {
            const r = await fetch(GAS_URL + "?t=" + Date.now());
            const res = await r.json();
            rawData = res.orders; serial = res.nextSerial; settings = res.settings;
            renderOrders();
            document.getElementById('loading').style.display = 'none';
        }

        function addInputRow() {
            const d = document.createElement('div');
            d.className = 'item-row';
            d.innerHTML = `<input type="text" class="i-n" placeholder="商品名稱" oninput="calcTotal()"><div style="display:flex; gap:5px;"><input type="number" class="i-q" value="1" style="flex:0.4" oninput="calcTotal()"><input type="number" class="i-p" placeholder="售價" style="flex:1" oninput="calcTotal()"><input type="number" class="i-c" placeholder="成本" style="flex:0.8; background:#FFF9DB;"><button style="width:45px; background:var(--blue);" onclick="applyFX(this)">💹</button></div>`;
            document.getElementById('new-items-area').appendChild(d);
        }

        function applyFX(btn) {
            const pInput = btn.parentElement.querySelector('.i-p');
            const amt = prompt(`輸入 ${settings.from} 金額:`);
            if(amt) { pInput.value = Math.ceil(amt * settings.rate * (1 + settings.fee/100)); calcTotal(); }
        }

        function calcTotal() {
            let t = 0; document.querySelectorAll('.item-row').forEach(r => { t += (r.querySelector('.i-q').value * r.querySelector('.i-p').value || 0); });
            document.getElementById('total-display').innerText = "總計: HKD $" + t;
        }

        async function saveOrder() {
            const tel = document.getElementById('cust-tel').value;
            if(!tel) return alert("輸入電話");
            let its = [];
            document.querySelectorAll('.item-row').forEach(r => {
                const n = r.querySelector('.i-n').value;
                if(n) its.push({ name: n, qty: parseInt(r.querySelector('.i-q').value), price: parseFloat(r.querySelector('.i-p').value), cost: parseFloat(r.querySelector('.i-c').value) || 0 });
            });
            const d = new Date(); const dateStr = d.getDate() + ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][d.getMonth()];
            const newO = { id: "WS"+dateStr+serial, date: document.getElementById('order-date').value, tel, rem: document.getElementById('order-rem').value, items: its };
            document.getElementById('loading').style.display = 'flex';
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'UPDATE_SINGLE', order: newO, nextSerial: serial + 1}) });
            location.reload();
        }

        function renderOrders() {
            const list = document.getElementById('order-list');
            const grouped = {};
            rawData.forEach(r => {
                if(!grouped[r.id]) grouped[r.id] = { ...r, items: [] };
                grouped[r.id].items.push(r);
            });
            list.innerHTML = Object.values(grouped).reverse().map(o => {
                const total = o.items.reduce((s, it) => s + (it.price*it.qty), 0);
                return `<div class="card">
                    <div style="font-size:10px; color:#AAA;">#${o.id} | ${new Date(o.date).toLocaleDateString()}</div>
                    <div style="font-weight:bold;">📞 ${o.tel}</div>
                    <div style="font-size:12px; color:#777;">🏠 ${o.rem}</div>
                    <div style="margin:8px 0;">${o.items.map(it => `<div style="font-size:13px;">• ${it.name} x${it.qty} ${it.bought?'✅':'❌'}</div>`).join('')}</div>
                    <div style="text-align:right; font-weight:bold; color:var(--primary);">總額: $${total}</div>
                    <button onclick="showTemplate('${o.id}')" style="background:var(--green); font-size:12px; margin-top:10px;">📋 生成通知文案</button>
                </div>`;
            }).join('');
        }

        function renderBuy() {
            const search = document.getElementById('buy-search').value.toLowerCase();
            const filter = document.getElementById('buy-filter').value;
            const summary = document.getElementById('buy-summary');
            
            // 按商品名稱匯總，但保留每一行的 rowIdx
            let items = rawData.filter(r => r.name.toLowerCase().includes(search));
            if(filter === 'pending') items = items.filter(r => !r.bought);
            if(filter === 'bought') items = items.filter(r => r.bought);

            summary.innerHTML = items.map(r => `
                <div class="buy-item ${r.bought?'is-bought':''}" onclick="toggleBought(${r.rowIdx}, ${r.bought})">
                    <div>
                        <div style="font-weight:bold;">${r.name} x${r.qty}</div>
                        <div style="font-size:10px; color:#999;">單號: ${r.id} | 客戶: ${r.tel}</div>
                    </div>
                    <div style="font-size:20px;">${r.bought ? '✅' : '⬜'}</div>
                </div>
            `).join('');
        }

        async function toggleBought(rowIdx, currentStatus) {
            document.getElementById('loading').style.display = 'flex';
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'TOGGLE_BOUGHT', rowIdx: rowIdx, status: !currentStatus}) });
            location.reload();
        }

        function showTemplate(orderId) {
            const items = rawData.filter(r => r.id === orderId);
            const o = items[0];
            const total = items.reduce((s, it) => s + (it.price * it.qty), 0);
            const template = `【SlowOver 訂購確認】✨
感謝你的支持！以下是你的訂單詳情：

📌 訂單編號：${o.id}
📅 訂購日期：${new Date(o.date).toLocaleDateString()}

📦 訂購項目：
${items.map(it => `- ${it.name} x${it.qty} ($${it.price})`).join('\n')}

💰 總金額：HKD $${total}
📍 收件資訊/備註：${o.rem || '（請提供收件地址/入盒要求）'}

----------------------------
付款資料 📄
1. 麻煩在24小時內完成付款並回傳入數證明（截圖/入數紙）
2. 請在入數證明上備註電話號碼，緊記保留作證明
3. 確認付款後會發送確認訂單訊息
4. 收到確認訂單訊息後請再三核對訂單內容（產品內容/款式/數量），所有訂單一經確認後不可取消或更改，如未能成功購買，會全數退款
5. 請考慮清楚先落單，棄單將會當黑名單處理
6. 所有產品寄出前均會檢查，運送風險需由買家承擔。
7. 貨到日期受物流影響或有誤差，敬請見諒。

*記得完成付款後發送CAP圖給我們*`;

            document.getElementById('copy-area').value = template;
            document.getElementById('copy-modal').style.display = 'flex';
        }

        function copyToClipboard() {
            const area = document.getElementById('copy-area');
            area.select(); document.execCommand('copy');
            alert('文案已複製！'); closeModal();
        }

        function closeModal() { document.getElementById('copy-modal').style.display = 'none'; }
        
        function switchPage(p, btn) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            btn.classList.add('active');
            if(p === 'buy') renderBuy();
        }
    </script>
</body>
</html>
