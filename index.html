<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V96.5</title>
    <style>
        :root { --main-bg: #222454; --card-bg: #ffffff; --text-dark: #333; --important: #730000; --btn-green: #2D6A4F; --accent: #D4A373; }
        body { font-family: -apple-system, sans-serif; background: var(--main-bg); color: var(--text-dark); margin: 0; padding: 10px 10px 120px 10px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #ddd; z-index: 1000; }
        .nav-item { flex: 1; padding: 15px 0; text-align: center; font-size: 12px; font-weight: bold; color: #999; }
        .nav-item.active { color: var(--main-bg); border-top: 3px solid var(--main-bg); }
        .page { display: none; max-width: 600px; margin: 0 auto; } .page.active { display: block; }
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { border-radius: 8px; border: none; padding: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-sync { background: var(--accent); color: white; margin-bottom: 10px; width: 100%; }
        .btn-save { background: var(--main-bg); color: white; width: 100%; font-size: 16px; }
        .important-text { color: var(--important); font-weight: bold; }
        .btn-whatsapp { background: var(--btn-green); color: white; width: 100%; margin-top: 10px; }
        .filter-group { display: flex; flex-wrap: wrap; gap: 8px; background: #f0f0f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .filter-group label { font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .item-row { background: #fdfdfd; padding: 10px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); display:none; justify-content:center; align-items:center; z-index:9999; font-weight:bold; }
    </style>
</head>
<body>

    <div id="loading">🔄 雲端同步中...</div>
    <button class="btn-sync" onclick="syncFromCloud()">🔄 立即同步最新資料</button>

    <div id="page-order" class="page active">
        <div class="card">
            <h3 style="color:var(--main-bg); margin:0 0 10px 0;">📝 登記新訂單</h3>
            <div style="display:flex; gap:5px;">
                <input type="text" id="order-id" placeholder="單號 (可自訂)" style="flex:1">
                <input type="date" id="order-date" style="flex:1">
            </div>
            <input type="tel" id="cust-tel" placeholder="客戶 WhatsApp 電話">
            <div id="new-items-area"></div>
            <button onclick="addInputRow()" style="background:#eee; width:100%; margin-bottom:10px; color:#555;">+ 增加商品項目</button>
            <textarea id="order-rem" placeholder="📍 地址 / 額外備註 (O 欄)"></textarea>
            <div style="text-align:right; margin:10px 0; font-size:18px;">總金額: <span class="important-text" id="total-display">$0</span></div>
            <button class="btn-save" onclick="saveOrder()">💾 儲存訂單到雲端</button>
        </div>

        <div class="card">
            <input type="text" id="search-order" placeholder="🔍 搜尋電話/商品/狀態..." oninput="renderOrders()">
        </div>
        <div id="order-list"></div>
    </div>

    <div id="page-buy" class="page">
        <div class="card">
            <h4 style="margin:0 0 10px 0;">🛍️ 採購篩選 (自由組合)</h4>
            <div class="filter-group" id="buy-filters" onchange="renderBuy()">
                <label><input type="checkbox" id="f-paid" checked> 已付</label>
                <label><input type="checkbox" id="f-unpaid" checked> 未付</label>
                <label><input type="checkbox" id="f-bought"> 已買</label>
                <label><input type="checkbox" id="f-unbought" checked> 未買</label>
            </div>
            <input type="text" id="search-buy" placeholder="🔍 搜尋特定商品..." oninput="renderBuy()">
        </div>
        <div id="buy-summary"></div>
    </div>

    <div id="page-stats" class="page">
        <div class="card" style="display:flex; justify-content:space-around; text-align:center; background:var(--main-bg); color:white;">
            <div>利潤<br><span style="color:#00ff88; font-size:20px; font-weight:bold;" id="stat-profit">$0</span></div>
            <div>總成本<br><span id="stat-cost">$0</span></div>
            <div>營業額<br><span id="stat-rev">$0</span></div>
        </div>
        <div id="stat-list"></div>
    </div>

    <div id="page-fx" class="page">
        <div class="card">
            <h3 style="color:var(--main-bg); margin-top:0;">💹 匯率設定 (外幣 ⮕ 港幣)</h3>
            <select id="fx-from" onchange="updateFXUI()">
                <option value="GBP">英鎊 (GBP)</option><option value="JPY">日圓 (JPY)</option>
                <option value="KRW">韓幣 (KRW)</option><option value="EUR">歐羅 (EUR)</option>
                <option value="USD">美元 (USD)</option>
            </select>
            <div id="rates-inputs"></div>
            <label style="font-size:12px;">手續費加成 %</label>
            <input type="number" id="fx-fee" step="0.1">
            <button class="btn-save" onclick="saveFX()">💾 儲存匯率設定</button>
        </div>
        <div class="card">
            <h4>最近 10 次更動紀錄</h4>
            <div id="fx-history" style="font-size:12px; color:#666;"></div>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchPage('order', this)">📝 訂單</div>
        <div class="nav-item" onclick="switchPage('buy', this)">🛍️ 採購</div>
        <div class="nav-item" onclick="switchPage('stats', this)">📊 統計</div>
        <div class="nav-item" onclick="switchPage('fx', this)">💹 匯率</div>
    </nav>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec";
        let rawData = [], settings = {}, serial = 402;

        async function syncFromCloud() {
            document.getElementById('loading').style.display = 'flex';
            try {
                const r = await fetch(GAS_URL + "?t=" + Date.now());
                const res = await r.json();
                rawData = res.orders; serial = res.nextSerial; settings = res.settings;
                
                if(!document.getElementById('order-id').value) {
                    const d = new Date();
                    document.getElementById('order-id').value = "WS" + d.getDate() + (d.getMonth()+1) + serial;
                }
                
                renderOrders(); renderFXInputs(); renderStats(); renderFXHistory();
            } catch(e) { alert("同步失敗，請檢查網絡"); }
            document.getElementById('loading').style.display = 'none';
        }

        function renderOrders() {
            const list = document.getElementById('order-list');
            const search = document.getElementById('search-order').value.toLowerCase();
            
            // 核心排序：已付按時間(P欄)排先，未付排後
            const sorted = [...rawData].sort((a,b) => {
                if (a.paid !== b.paid) return b.paid - a.paid; // 已付先
                if (a.paid && b.paid) return a.payTime - b.payTime; // 大家都付了，按時間先後
                return b.rowIdx - a.rowIdx; // 都未付，按新舊
            });

            const grouped = {};
            sorted.forEach(r => {
                if(r.tel.includes(search) || r.name.toLowerCase().includes(search) || r.id.toLowerCase().includes(search)) {
                    if(!grouped[r.id]) grouped[r.id] = { ...r, items: [] };
                    grouped[r.id].items.push(r);
                }
            });

            list.innerHTML = Object.values(grouped).map(o => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span style="font-size:11px; color:#999;">#${o.id}</span>
                        <button class="btn-status" style="background:${o.paid?'var(--accent)':'#eee'}; color:${o.paid?'white':'#666'};" 
                                onclick="updateField(${o.items[0].rowIdx}, 'paid', '${o.paid?'⏳未付':'✅已付'}')">
                            ${o.paid?'✅ 已付款':'⏳ 未付款'}
                        </button>
                    </div>
                    <div style="font-weight:bold; font-size:16px; margin:5px 0;">📞 ${o.tel}</div>
                    <div style="font-size:12px; color:#777; margin-bottom:8px;">📍 ${o.rem}</div>
                    <div style="border-top:1px dotted #eee; padding-top:8px;">
                        ${o.items.map(it => `
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <input type="text" value="${it.name}" style="border:none; width:55%; padding:2px; font-weight:bold;" onchange="updateField(${it.rowIdx}, 'name', this.value)">
                                <button onclick="updateField(${it.rowIdx}, 'bought', '${it.bought?false:true}')" 
                                        style="background:${it.bought?'var(--btn-green)':'#ccc'}; color:white; font-size:11px; padding:5px 10px;">
                                    ${it.bought?'已買':'未買'}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-whatsapp" onclick="generateMsg('${o.id}')">📋 生成 WhatsApp 文案</button>
                </div>
            `).join('');
        }

        function renderBuy() {
            const search = document.getElementById('search-buy').value.toLowerCase();
            const fPaid = document.getElementById('f-paid').checked;
            const fUnpaid = document.getElementById('f-unpaid').checked;
            const fBought = document.getElementById('f-bought').checked;
            const fUnbought = document.getElementById('f-unbought').checked;

            let filtered = rawData.filter(r => {
                const matchSearch = r.name.toLowerCase().includes(search) || r.tel.includes(search);
                const matchPaid = (r.paid && fPaid) || (!r.paid && fUnpaid);
                const matchBought = (r.bought && fBought) || (!r.bought && fUnbought);
                return matchSearch && matchPaid && matchBought;
            });

            const buyMap = {};
            filtered.forEach(r => {
                if(!buyMap[r.name]) buyMap[r.name] = { total: 0, custs: [] };
                buyMap[r.name].total += r.qty;
                buyMap[r.name].custs.push(r);
            });

            document.getElementById('buy-summary').innerHTML = Object.keys(buyMap).map(name => `
                <div class="card" style="border-left:5px solid var(--main-bg);">
                    <div style="display:flex; justify-content:space-between; font-weight:bold;">
                        <span>📦 ${name}</span>
                        <span class="important-text">總需: x${buyMap[name].total}</span>
                    </div>
                    ${buyMap[name].custs.map(c => `
                        <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:8px; color:#555; background:#f9f9f9; padding:5px; border-radius:4px;">
                            <span>${c.tel} (x${c.qty}) [${c.paid?'付':'未'}]</span>
                            <button onclick="updateField(${c.rowIdx}, 'bought', '${c.bought?false:true}')" style="font-size:10px; padding:2px 8px; background:${c.bought?'var(--btn-green)':'#ccc'}; color:white;">${c.bought?'已買':'未買'}</button>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function renderStats() {
            let rev = 0, cost = 0;
            const list = rawData.map(it => {
                rev += it.price * it.qty;
                cost += it.cost * it.qty;
                return `<div class="item-row" style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:13px; width:45%;">${it.name}<br><small style="color:#999;">${it.tel}</small></div>
                    <div style="text-align:right;">
                        <span style="font-size:11px;">成本:</span>
                        <input type="number" value="${it.cost}" style="width:70px; padding:4px; font-size:12px; margin:0;" onchange="updateField(${it.rowIdx}, 'cost', this.value)">
                        <div style="font-size:11px; color:var(--btn-green);">利潤: $${(it.price - it.cost)*it.qty}</div>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('stat-rev').innerText = `$${rev}`;
            document.getElementById('stat-cost').innerText = `$${cost}`;
            document.getElementById('stat-profit').innerText = `$${rev - cost}`;
            document.getElementById('stat-list').innerHTML = list;
        }

        // --- 匯率與基礎功能 ---
        function addInputRow() {
            const d = document.createElement('div'); d.className = 'item-row';
            d.innerHTML = `
                <input type="text" class="i-n" placeholder="商品名稱" oninput="calcTotal()">
                <div style="display:flex; gap:5px;">
                    <input type="number" class="i-q" value="1" style="flex:0.3" oninput="calcTotal()">
                    <input type="number" class="i-p" placeholder="售價" style="flex:1" oninput="calcTotal()">
                    <button style="width:45px; background:var(--accent); color:white;" onclick="applyFX(this)">💹</button>
                </div>
            `;
            document.getElementById('new-items-area').appendChild(d);
        }
        
        function applyFX(btn) {
            const pInput = btn.parentElement.querySelector('.i-p');
            const amt = prompt(`輸入 ${settings.from} 外幣金額:`);
            if(amt) {
                const rate = settings.rates[settings.from];
                pInput.value = Math.ceil(amt * rate * (1 + settings.fee/100));
                calcTotal();
            }
        }

        function calcTotal() {
            let t = 0; document.querySelectorAll('.item-row').forEach(r => { t += (r.querySelector('.i-q').value * r.querySelector('.i-p').value || 0); });
            document.getElementById('total-display').innerText = `$${t}`;
        }

        async function updateField(rowIdx, field, val) {
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'UPDATE_FIELD', rowIdx, field, val}) });
            syncFromCloud();
        }

        async function saveOrder() {
            const id = document.getElementById('order-id').value;
            const tel = document.getElementById('cust-tel').value;
            if(!id || !tel) return alert("請填寫單號及電話");
            let its = [];
            document.querySelectorAll('.item-row').forEach(r => {
                const n = r.querySelector('.i-n').value;
                if(n) its.push({ name: n, qty: parseInt(r.querySelector('.i-q').value), price: parseFloat(r.querySelector('.i-p').value) });
            });
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'UPDATE_SINGLE', order: {id, date: document.getElementById('order-date').value, tel, rem: document.getElementById('order-rem').value, items: its}, nextSerial: serial+1}) });
            location.reload();
        }

        function renderFXInputs() {
            document.getElementById('rates-inputs').innerHTML = Object.keys(settings.rates).map(cur => `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span>${cur}</span>
                    <input type="number" class="fx-val" data-cur="${cur}" value="${settings.rates[cur]}" step="0.001" style="width:60%;">
                </div>
            `).join('');
            document.getElementById('fx-from').value = settings.from;
            document.getElementById('fx-fee').value = settings.fee;
        }

        function renderFXHistory() {
            const hist = settings.history || [];
            document.getElementById('fx-history').innerHTML = hist.slice(-10).reverse().map(h => `<div>${h}</div>`).join('');
        }

        async function saveFX() {
            settings.from = document.getElementById('fx-from').value;
            settings.fee = parseFloat(document.getElementById('fx-fee').value);
            document.querySelectorAll('.fx-val').forEach(i => { settings.rates[i.dataset.cur] = parseFloat(i.value); });
            if(!settings.history) settings.history = [];
            settings.history.push(`${new Date().toLocaleString()}: ${settings.from}設為預設`);
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'SAVE_SETTINGS', settings}) });
            syncFromCloud();
        }

        function generateMsg(id) {
            const its = rawData.filter(r => r.id === id);
            const o = its[0];
            const total = its.reduce((s, it) => s + (it.price*it.qty), 0);
            const msg = `【SlowOver 訂購確認】✨\n\n📌 訂單編號：${o.id}\n📅 訂購日期：${o.date}\n📦 訂購項目：\n${its.map(it => `- ${it.name} x${it.qty} ($${it.price})`).join('\n')}\n\n💰 總金額：HKD $${total}\n📍 備註：${o.rem}\n\n----------------------------\n付款資料 📄\n1. 麻煩在24小時內或者連線截單前完成付款並回傳入數證明（截圖/入數紙）\n2. 請在入數證明上備註電話號碼，緊記保留作證明\n3. 確認付款後會發送確認訂單訊息\n4. 所有訂單一經確認後不可取消或更改\n5. 棄單將會當黑名單處理\n6. 運送風險需由買家承擔\n7. 貨到日期受物流影響或有誤差\n\n*記得完成付款後發送CAP圖給我們*`;
            const el = document.createElement('textarea'); el.value = msg; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            alert("文案已複製，可直接貼到 WhatsApp");
        }

        function switchPage(p, btn) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            btn.classList.add('active');
            if(p === 'buy') renderBuy();
            if(p === 'stats') renderStats();
        }

        window.onload = () => { document.getElementById('order-date').valueAsDate = new Date(); addInputRow(); syncFromCloud(); };
    </script>
</body>
</html>
