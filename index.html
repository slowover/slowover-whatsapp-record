<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SlowOver CRM V119</title>
    <style>
        :root { --bg: #FDFCFB; --card: #FFF; --text: #4A3F35; --p: #C5A082; --s: #F4F0EB; --ok: #889E81; --ng: #BC6C74; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, "SF Pro Text", sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            /* 針對 Pro Max 底部留白，防止導航欄遮擋 */
            padding-bottom: calc(120px + env(safe-area-inset-bottom)); 
            overflow-x: hidden; width: 100vw;
        }
        
        #sync-mask { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; display:none; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
        
        header { padding: calc(50px + env(safe-area-inset-top)) 20px 15px; background: var(--bg); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -1px; }

        .page { display: none; padding: 0 20px; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); border-radius: 24px; padding: 22px; margin-bottom: 18px; border: 1px solid rgba(0,0,0,0.05); box-shadow: 0 6px 16px rgba(74,63,53,0.03); }
        
        label { font-size: 11px; font-weight: 700; color: #A09388; text-transform: uppercase; margin-bottom: 6px; display: block; padding-left: 4px; }
        input, textarea { width: 100%; padding: 16px; border-radius: 14px; border: 1px solid transparent; background: #F5F5F5; font-size: 16px; margin-top: 4px; transition: 0.2s; }
        input:focus { background: #FFF; border-color: var(--p); outline: none; }

        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.97); opacity: 0.8; }
        .btn-p { background: var(--p); color: white; }
        .btn-s { background: var(--s); color: var(--text); }

        /* 導航欄優化 */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.92); 
            backdrop-filter: blur(20px); border-top: 0.5px solid rgba(0,0,0,0.1); 
            display: flex; padding-bottom: env(safe-area-inset-bottom); 
            height: calc(80px + env(safe-area-inset-bottom)); z-index: 1000;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #BBB; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--p); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* 詳情頁 Overlay */
        #detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; overflow-y: auto; padding: calc(30px + env(safe-area-inset-top)) 20px 140px; }
        
        .remind-box { background: #FFF3F3; border-left: 5px solid var(--ng); padding: 18px; border-radius: 18px; margin-bottom: 14px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="sync-mask">⌛ 同步數據中...</div>

    <header><h1 id="view-title">訂單登記</h1></header>

    <div id="page-order" class="page active">
        <div class="card">
            <label>客戶電話</label>
            <input type="tel" id="new-tel" placeholder="輸入 8 位電話號碼">
            <div id="new-items" style="margin-top:15px;"></div>
            <button class="btn btn-s" onclick="addItemRow()">+ 增加商品</button>
            <button class="btn btn-p" style="margin-top:12px;" onclick="saveOrder()">確認儲存</button>
        </div>
        <div id="order-list"></div>
    </div>

    <div id="page-buy" class="page">
        <div id="buy-list"></div>
    </div>

    <div id="page-remind" class="page">
        <div id="remind-list"></div>
    </div>

    <div id="page-stats" class="page">
        <div class="card" style="background:var(--p); color:white; border:none;">
            <div style="font-size:12px; opacity:0.8;">本月利潤 (售價-成本)</div>
            <div id="stat-profit" style="font-size:32px; font-weight:800;">$0</div>
        </div>
        <div id="stat-items"></div>
    </div>

    <div id="page-set" class="page">
        <div class="card">
            <h3 style="margin-top:0;">收款資訊設定</h3>
            <label>PayMe 連結</label><input type="text" id="set-payme">
            <label>FPS ID</label><input type="text" id="set-fpsid">
            <label>FPS 名稱</label><input type="text" id="set-fpsname">
            <label>付款細則</label><textarea id="set-terms" rows="4"></textarea>
            <button class="btn btn-p" style="margin-top:20px;" onclick="saveSettings()">儲存設定</button>
        </div>
    </div>

    <div id="detail-overlay">
        <button class="btn btn-s" style="width:100px; margin-bottom:25px;" onclick="closeDetail()">← 返回</button>
        <div id="detail-content"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('order', this)"><span class="nav-icon">📋</span>訂單</div>
        <div class="nav-item" onclick="nav('buy', this)"><span class="nav-icon">📦</span>採購</div>
        <div class="nav-item" onclick="nav('remind', this)"><span class="nav-icon">🔔</span>提醒</div>
        <div class="nav-item" onclick="nav('stats', this)"><span class="nav-icon">📈</span>統計</div>
        <div class="nav-item" onclick="nav('set', this)"><span class="nav-icon">⚙️</span>設定</div>
    </nav>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec";
        let rawData = [], config = {};

        async function sync() {
            document.getElementById('sync-mask').style.display = 'flex';
            try {
                const res = await fetch(`${API}?t=${Date.now()}`);
                config = await res.json();
                rawData = config.orders;
                render();
                // 填入設定數據
                document.getElementById('set-payme').value = config.payme;
                document.getElementById('set-fpsid').value = config.fpsId;
                document.getElementById('set-fpsname').value = config.fpsName;
                document.getElementById('set-terms').value = config.terms;
            } catch(e) { alert("讀取數據失敗，請確認 API 網址"); }
            document.getElementById('sync-mask').style.display = 'none';
        }

        function render() {
            // 訂單列表
            const grouped = rawData.reduce((acc, o) => { acc[o.id] = acc[o.id] || { ...o, items: [] }; acc[o.id].items.push(o); return acc; }, {});
            document.getElementById('order-list').innerHTML = Object.values(grouped).reverse().map(o => `
                <div class="card" onclick="openDetail('${o.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="font-size:18px;">${o.tel}</b>
                        <span style="font-size:12px; font-weight:800; color:${o.paid?'var(--ok)':'var(--ng)'}">${o.paid?'✅ 已付':'⏳ 待付'}</span>
                    </div>
                    <div style="font-size:12px; color:#AAA; margin-top:6px;">#${o.id} | ${new Date(o.date).toLocaleDateString()}</div>
                </div>
            `).join('');

            // 提醒頁 (超過 24 小時未付)
            const now = Date.now();
            const overdue = rawData.filter(r => !r.paid && (now - new Date(r.date).getTime() > 86400000));
            const seenIds = new Set();
            document.getElementById('remind-list').innerHTML = overdue.map(o => {
                if(seenIds.has(o.id)) return ''; seenIds.add(o.id);
                return `<div class="remind-box" onclick="openDetail('${o.id}')"><b>📞 ${o.tel}</b> (#${o.id})<br><small>已逾期 24 小時以上未付款</small></div>`;
            }).join('') || '<p style="text-align:center; color:#AAA; margin-top:40px;">目前沒有逾期訂單</p>';

            // 統計頁 (單位成本輸入)
            let totalProfit = 0; const itemCosts = {};
            rawData.forEach(o => {
                totalProfit += (o.price - o.cost) * o.qty;
                if(!itemCosts[o.name]) itemCosts[o.name] = { cost: o.cost, rowIdx: o.rowIdx };
            });
            document.getElementById('stat-profit').innerText = `$${totalProfit.toLocaleString()}`;
            document.getElementById('stat-items').innerHTML = `<h4 style="margin:20px 0 10px;">💰 商品單位成本設定</h4>` + Object.entries(itemCosts).map(([n, d]) => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:16px;">
                    <span style="font-size:14px; font-weight:700;">${n}</span>
                    <input type="number" value="${d.cost}" style="width:100px; margin:0; padding:10px;" onchange="updateField(${d.rowIdx}, 'cost', this.value)">
                </div>
            `).join('');
        }

        function openDetail(id) {
            const its = rawData.filter(r => r.id === id);
            const o = its[0];
            document.getElementById('detail-content').innerHTML = `
                <div class="card">
                    <h2 style="margin:0; font-size:24px;">${o.tel}</h2>
                    <p style="color:#AAA; margin-top:5px;">單號: #${o.id}</p>
                    <button class="btn btn-p" style="margin-top:15px;" onclick="updateBatchField('${o.id}', 'paid', '${o.paid?'⏳未付':'✅已付'}')">付款狀態：${o.paid?'✅ 已收錢':'⏳ 尚未付款'}</button>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
                        <button class="btn btn-s" style="font-size:13px;" onclick="updateBatchField('${o.id}', 'arrived', '${o.arrived?'❌未到':'✅已到'}')">到貨：${o.arrived?'✅':'❌'}</button>
                        <button class="btn btn-s" style="font-size:13px;" onclick="updateBatchField('${o.id}', 'shipped', '${o.shipped?'❌未出':'✅已出'}')">出貨：${o.shipped?'✅':'❌'}</button>
                    </div>
                </div>
                <h3>商品清單 (點擊修改名/量/價)</h3>
                ${its.map(it => `
                    <div class="card" style="margin-bottom:12px;" onclick="editRow(${it.rowIdx}, '${it.name}', ${it.qty}, ${it.price})">
                        <b style="font-size:16px;">${it.name}</b><br>
                        <span style="color:var(--p); font-weight:800; font-size:15px;">$${it.price} x ${it.qty}</span>
                    </div>
                `).join('')}
            `;
            document.getElementById('detail-overlay').style.display = 'block';
        }

        async function editRow(rowIdx, n, q, p) {
            const newN = prompt("修改商品名稱", n); if(!newN) return;
            const newQ = prompt("修改數量", q); if(!newQ) return;
            const newP = prompt("修改銷售單價", p); if(!newP) return;
            document.getElementById('sync-mask').style.display = 'flex';
            await fetch(API,{method:'POST', body:JSON.stringify({type:'UPDATE_FIELD', rowIdx, field:'name', val:newN})});
            await fetch(API,{method:'POST', body:JSON.stringify({type:'UPDATE_FIELD', rowIdx, field:'qty', val:newQ})});
            await fetch(API,{method:'POST', body:JSON.stringify({type:'UPDATE_FIELD', rowIdx, field:'price', val:newP})});
            await sync(); openDetail(rawData.find(r=>r.rowIdx==rowIdx).id);
        }

        async function updateBatchField(id, field, val) {
            document.getElementById('sync-mask').style.display = 'flex';
            await fetch(API,{method:'POST', body:JSON.stringify({type:'UPDATE_FIELD', orderId:id, field, val})});
            await sync(); openDetail(id);
        }

        async function updateField(rowIdx, field, val) {
            document.getElementById('sync-mask').style.display = 'flex';
            await fetch(API,{method:'POST', body:JSON.stringify({type:'UPDATE_FIELD', rowIdx, field, val})});
            await sync();
        }

        async function saveOrder() {
            const tel = document.getElementById('new-tel').value;
            const itemNodes = document.querySelectorAll('.item-row');
            const items = Array.from(itemNodes).map(n => ({
                name: n.querySelector('.in-n').value,
                qty: parseInt(n.querySelector('.in-q').value) || 1,
                price: parseFloat(n.querySelector('.in-p').value) || 0
            })).filter(i => i.name);
            
            if(!tel || items.length === 0) return alert("請填寫電話與至少一項商品");
            const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            const orderId = `WS26${months[new Date().getMonth()]}${String(config.serial).padStart(3, '0')}`;
            
            document.getElementById('sync-mask').style.display = 'flex';
            await fetch(API, {method:'POST', body:JSON.stringify({type:'SAVE_BATCH', orders:[{id:orderId, tel, date:new Date().toISOString(), items}]})});
            document.getElementById('new-tel').value = ""; document.getElementById('new-items').innerHTML = "";
            addItemRow(); await sync(); alert("成功儲存！單號: " + orderId);
        }

        async function saveSettings() {
            const payload = {
                type: 'UPDATE_SETTINGS',
                payme: document.getElementById('set-payme').value,
                fpsId: document.getElementById('set-fpsid').value,
                fpsName: document.getElementById('set-fpsname').value,
                terms: document.getElementById('set-terms').value
            };
            document.getElementById('sync-mask').style.display = 'flex';
            await fetch(API, {method:'POST', body:JSON.stringify(payload)});
            await sync(); alert("系統設定已更新");
        }

        function addItemRow() {
            const d = document.createElement('div'); d.className='item-row'; d.style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; margin-bottom:12px;";
            d.innerHTML = `<input type="text" class="in-n" placeholder="品名"><input type="number" class="in-q" value="1"><input type="number" class="in-p" placeholder="售價">`;
            document.getElementById('new-items').appendChild(d);
        }

        function nav(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active'); el.classList.add('active');
            const titles = {'order':'訂單登記','buy':'採購管理','remind':'待付提醒','stats':'利潤統計','set':'系統設定'};
            document.getElementById('view-title').innerText = titles[p];
        }
        function closeDetail() { document.getElementById('detail-overlay').style.display = 'none'; }
        window.onload = () => { sync(); addItemRow(); };
    </script>
</body>
</html>
