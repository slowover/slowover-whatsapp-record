<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SlowOver CRM Premium</title>
    <style>
        :root { 
            --bg: #FDFCFB; --card: #FFFFFF; --text: #4A3F35; 
            --primary: #C5A082; --secondary: #F4F0EB;
            --success: #889E81; --danger: #BC6C74; --border: rgba(0,0,0,0.06);
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; 
            background: var(--bg); color: var(--text); margin: 0;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
            overflow-x: hidden;
        }

        /* 專業感關鍵：全屏加載遮罩 */
        #sync-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999;
            display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); font-weight: 500; letter-spacing: 1px;
        }

        header {
            padding: calc(40px + env(safe-area-inset-top)) 20px 20px;
            background: var(--bg); position: sticky; top: 0; z-index: 100;
        }
        header h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -1px; }

        .page { display: none; padding: 0 20px; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .page.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { 
            background: var(--card); border-radius: 24px; padding: 24px; 
            margin-bottom: 20px; border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(74, 63, 53, 0.04);
        }

        /* 輸入框美化 */
        .field-label { font-size: 11px; font-weight: 700; color: #A09388; text-transform: uppercase; margin-bottom: 8px; display: block; }
        input { 
            width: 100%; padding: 16px; border-radius: 16px; border: 1px solid transparent;
            font-size: 17px; background: #F5F5F5; transition: all 0.2s;
        }
        input:focus { background: #FFF; border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(197, 160, 130, 0.1); }

        /* 按鈕視覺反饋 */
        .btn { 
            width: 100%; padding: 18px; border-radius: 18px; border: none; 
            font-weight: 600; font-size: 16px; transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
        .btn-p { background: var(--primary); color: white; margin-top: 10px; }
        .btn-s { background: var(--secondary); color: var(--text); margin-top: 10px; }

        /* 導航欄固定在底部安全區域以上 */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.85);
            backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid rgba(0,0,0,0.1);
            display: flex; padding-bottom: env(safe-area-inset-bottom); height: calc(70px + env(safe-area-inset-bottom));
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #BBB; transition: color 0.3s; }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
        .nav-label { font-size: 10px; font-weight: 600; }

        /* 訂單卡片狀態標籤 */
        .status-pill { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }
        .paid { background: #EBF2EB; color: var(--success); }
        .unpaid { background: #F9EBEB; color: var(--danger); }
    </style>
</head>
<body>

    <div id="sync-mask">⌛ 同步數據中...</div>

    <header>
        <h1 id="view-title">最新訂單</h1>
    </header>

    <div id="page-order" class="page active">
        <div class="card">
            <span class="field-label">客戶電話</span>
            <input type="tel" id="new-tel" placeholder="輸入電話號碼">
            <div id="item-rows" style="margin-top:20px;"></div>
            <button class="btn btn-s" onclick="addItemRow()">+ 增加商品項目</button>
            <button class="btn btn-p" onclick="handleSave()">確認並儲存訂單</button>
        </div>
        <div id="order-container"></div>
    </div>

    <div id="page-buy" class="page">
        <div id="buy-container"></div>
    </div>

    <div id="page-stats" class="page">
        <div class="card" style="background: var(--primary); color: white; border: none;">
            <span class="field-label" style="color: rgba(255,255,255,0.7);">本月純利預估</span>
            <h2 id="stat-profit" style="font-size: 32px; margin: 5px 0;">$0</h2>
        </div>
        <div id="stat-items"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchNav('order', this)">
            <span class="nav-icon">📋</span><span class="nav-label">訂單</span>
        </div>
        <div class="nav-item" onclick="switchNav('buy', this)">
            <span class="nav-icon">📦</span><span class="nav-label">採購</span>
        </div>
        <div class="nav-item" onclick="switchNav('stats', this)">
            <span class="nav-icon">📈</span><span class="nav-label">統計</span>
        </div>
    </nav>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec";
        let data = [], settings = {};

        async function refresh() {
            document.getElementById('sync-mask').style.display = 'flex';
            try {
                const res = await fetch(`${API}?t=${Date.now()}`);
                const json = await res.json();
                data = json.orders;
                settings = json;
                render();
            } catch(e) { console.error(e); }
            document.getElementById('sync-mask').style.display = 'none';
        }

        function render() {
            // 渲染訂單列表
            const orderBox = document.getElementById('order-container');
            const grouped = data.reduce((acc, obj) => {
                acc[obj.id] = acc[obj.id] || { ...obj, items: [] };
                acc[obj.id].items.push(obj);
                return acc;
            }, {});

            orderBox.innerHTML = Object.values(grouped).reverse().map(o => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div>
                            <div style="font-weight:700; font-size:18px;">${o.tel}</div>
                            <div style="color:#BBB; font-size:12px; margin-top:2px;">${o.id}</div>
                        </div>
                        <span class="status-pill ${o.paid?'paid':'unpaid'}">${o.paid?'已付款':'待付款'}</span>
                    </div>
                    <div style="margin-top:15px; border-top: 1px solid var(--border); padding-top:15px;">
                        ${o.items.map(i => `<div style="font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between;">
                            <span>${i.name}</span> <span style="color:#A09388;">x${i.qty}</span>
                        </div>`).join('')}
                    </div>
                </div>
            `).join('');

            // 渲染統計
            let totalProfit = 0;
            data.forEach(o => { totalProfit += (o.price - o.cost) * o.qty; });
            document.getElementById('stat-profit').innerText = `$${totalProfit.toLocaleString()}`;
        }

        async function handleSave() {
            const tel = document.getElementById('new-tel').value;
            const itemNodes = document.querySelectorAll('.item-row');
            const items = Array.from(itemNodes).map(n => ({
                name: n.querySelector('.in-n').value,
                qty: parseInt(n.querySelector('.in-q').value) || 0,
                price: parseFloat(n.querySelector('.in-p').value) || 0
            })).filter(i => i.name !== "");

            if(!tel || items.length === 0) return alert("請填寫完整內容");

            const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            const orderId = `WS26${months[new Date().getMonth()]}${String(settings.serial).padStart(3, '0')}`;

            document.getElementById('sync-mask').style.display = 'flex';
            const res = await fetch(API, {
                method: 'POST',
                body: JSON.stringify({
                    type: 'SAVE_BATCH',
                    orders: [{ id: orderId, tel, date: new Date().toISOString().split('T')[0], items }],
                    nextSerial: settings.serial + 1
                })
            });

            if(await res.text() === "SUCCESS") {
                document.getElementById('new-tel').value = "";
                document.getElementById('item-rows').innerHTML = "";
                addItemRow();
                await refresh(); // 保存後立即刷新，確保單號同步更新
            }
        }

        function addItemRow() {
            const d = document.createElement('div');
            d.className = 'item-row';
            d.style = "display:grid; grid-template-columns: 2fr 1fr 1fr; gap:10px; margin-bottom:12px;";
            d.innerHTML = `<input type="text" class="in-n" placeholder="品名"><input type="number" class="in-q" value="1"><input type="number" class="in-p" placeholder="售價">`;
            document.getElementById('item-rows').appendChild(d);
        }

        function switchNav(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            el.classList.add('active');
            document.getElementById('view-title').innerText = p === 'order' ? '最新訂單' : p === 'buy' ? '採購管理' : '利潤統計';
        }

        window.onload = () => { refresh(); addItemRow(); };
    </script>
</body>
</html>
