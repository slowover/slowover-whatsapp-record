<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V91.99</title>
    <style>
        :root { --primary: #D4A373; --bg: #FAF7F2; --text: #5F4B32; --accent: #8EAD91; --blue: #5C7CFA; --red: #E03131; --green: #25D366; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px 15px 120px 15px; }
        .card { background: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid rgba(212,163,115,0.1); }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; border-top: 1px solid #EEE; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .nav-item { flex: 1; padding: 15px 0; text-align: center; font-size: 11px; color: #BBB; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; max-width: 600px; margin: 0 auto; }
        .page.active { display: block; }
        input, textarea, button, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #E0D7CC; border-radius: 12px; font-size: 14px; outline: none; }
        textarea { height: 80px; resize: none; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; active { opacity: 0.7; } }
        .item-row { background: #FDFBFA; padding: 12px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #F0E6D8; }
        .btn-fx { width: 45px; background: var(--blue); padding: 0; margin-left: 5px; flex-shrink: 0; }
        #copy-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loading"><div>⏳ 正在讀取雲端數據...</div></div>

    <div id="copy-modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">📋 訂單通知文案</h3>
            <textarea id="copy-area" readonly style="height: 350px; font-size: 13px; line-height: 1.6; background: #F9F9F9; border: 1px solid #EEE; padding: 10px;"></textarea>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button onclick="copyToClipboard()" style="background:var(--green); flex: 1.5;">一鍵複製</button>
                <button onclick="closeModal()" style="background:#EEE; color:#666; flex: 1;">關閉</button>
            </div>
        </div>
    </div>

    <div id="page-main" class="page active">
        <div class="card">
            <h3 style="margin:0 0 15px 0; color:var(--primary);">📝 新增訂單</h3>
            <input type="date" id="order-date">
            <input type="tel" id="cust-tel" placeholder="客戶電話 (例如 85290001234)">
            <div id="new-items-area"></div>
            <button onclick="addInputRow()" style="background:#F1F3F5; color:#666; border:1px dashed #CCC; margin-bottom: 10px;">+ 增加商品項目</button>
            <textarea id="order-rem" placeholder="📍 送貨地址 / 入盒要求 / 其他備註 (對應表格 O 欄)"></textarea>
            <div id="total-display" style="text-align:right; font-weight:900; color:var(--red); padding:10px 0; font-size:20px;">總計: HKD $0</div>
            <button onclick="saveOrder()" style="background:var(--accent); height:60px; font-size:16px; border-radius: 15px;">💾 儲存並同步到表格</button>
        </div>
        <div id="order-list"></div>
    </div>

    <div id="page-buy" class="page">
        <div class="card">
            <h3 style="margin:0 0 15px 0; color:var(--primary);">🛍️ 待採購清單 (A-Z)</h3>
            <div id="buy-summary"></div>
        </div>
    </div>

    <div id="page-fx" class="page">
        <div class="card">
            <h3 style="margin:0 0 15px 0; color:var(--primary);">💹 匯率助手設定</h3>
            <div style="margin-bottom:15px;">
                <label style="font-size:12px; color:#999;">預設幣種</label>
                <select id="fx-from"><option value="GBP">GBP 英鎊</option><option value="JPY">JPY 日圓</option><option value="EUR">EUR 歐元</option></select>
            </div>
            <div style="margin-bottom:15px;">
                <label style="font-size:12px; color:#999;">當前匯率 (1外幣 = ? HKD)</label>
                <input type="number" id="fx-rate" step="0.001" placeholder="例如 10.2">
            </div>
            <div style="margin-bottom:15px;">
                <label style="font-size:12px; color:#999;">手續費 % (加成)</label>
                <input type="number" id="fx-fee" placeholder="例如 1.5">
            </div>
            <button onclick="saveFX()" style="height:50px;">💾 儲存雲端設定</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchPage('main', this)">📝 訂單</div>
        <div class="nav-item" onclick="switchPage('buy', this)">🛍️ 採購</div>
        <div class="nav-item" onclick="switchPage('fx', this)">💹 匯率</div>
    </nav>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec"; 
        let orders = [], serial = 402, settings = {from:'GBP', rate:10.2, fee:0};

        window.onload = () => {
            document.getElementById('order-date').valueAsDate = new Date();
            addInputRow();
            syncFromCloud();
        };

        async function syncFromCloud() {
            try {
                const r = await fetch(GAS_URL + "?t=" + Date.now());
                const res = await r.json();
                if(res.orders) {
                    orders = res.orders; serial = res.nextSerial;
                    if(res.settings) { 
                        settings = res.settings; 
                        document.getElementById('fx-from').value = settings.from;
                        document.getElementById('fx-rate').value = settings.rate;
                        document.getElementById('fx-fee').value = settings.fee;
                    }
                    render();
                }
                document.getElementById('loading').style.display = 'none';
            } catch(e) { alert("讀取雲端失敗，請檢查網址或權限"); }
        }

        function addInputRow() {
            const d = document.createElement('div');
            d.className = 'item-row';
            d.innerHTML = `
                <input type="text" class="i-n" placeholder="商品名稱" oninput="calcTotal()">
                <div style="display:flex; gap:5px; align-items:center;">
                    <input type="number" class="i-q" value="1" style="flex:0.4" oninput="calcTotal()">
                    <input type="number" class="i-p" placeholder="售價" style="flex:1" oninput="calcTotal()">
                    <input type="number" class="i-c" placeholder="成本" style="flex:0.8; background:#FFF9DB;">
                    <button class="btn-fx" onclick="applyFX(this)">💹</button>
                </div>`;
            document.getElementById('new-items-area').appendChild(d);
        }

        function applyFX(btn) {
            const pInput = btn.parentElement.querySelector('.i-p');
            const amt = prompt(`輸入 ${settings.from} 金額:`);
            if(amt) { pInput.value = Math.ceil(amt * settings.rate * (1 + settings.fee/100)); calcTotal(); }
        }

        async function saveFX() {
            settings = { from: document.getElementById('fx-from').value, rate: parseFloat(document.getElementById('fx-rate').value), fee: parseFloat(document.getElementById('fx-fee').value) || 0 };
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'SAVE_ALL', settings}) });
            alert("匯率助手設定已同步！");
        }

        function calcTotal() {
            let t = 0; document.querySelectorAll('.item-row').forEach(r => { t += (r.querySelector('.i-q').value * r.querySelector('.i-p').value || 0); });
            document.getElementById('total-display').innerText = "總計: HKD $" + t;
        }

        async function saveOrder() {
            const tel = document.getElementById('cust-tel').value;
            if(!tel) return alert("請輸入客戶電話");
            let its = [];
            document.querySelectorAll('.item-row').forEach(r => {
                const n = r.querySelector('.i-n').value;
                if(n) its.push({ name: n, qty: parseInt(r.querySelector('.i-q').value), price: parseFloat(r.querySelector('.i-p').value), cost: parseFloat(r.querySelector('.i-c').value) || 0 });
            });
            const d = new Date();
            const dateStr = d.getDate() + ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"][d.getMonth()];
            const newO = { id: "WS"+dateStr+serial, date: document.getElementById('order-date').value, tel, rem: document.getElementById('order-rem').value, items: its, paid: false };
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('loading').innerText = "正在儲存到表格...";
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type: 'UPDATE_SINGLE', order: newO, nextSerial: serial + 1}) });
            location.reload();
        }

        function render() {
            const list = document.getElementById('order-list');
            list.innerHTML = orders.slice().reverse().map((o, idx) => {
                const ri = orders.length - 1 - idx;
                const total = o.items.reduce((s, it) => s + (it.price*it.qty), 0);
                return `
                <div class="card">
                    <div style="font-size:10px; color:#AAA; display:flex; justify-content:space-between;"><span>#${o.id}</span><span>${new Date(o.date).toLocaleDateString()}</span></div>
                    <div style="font-weight:bold; font-size:16px; margin:5px 0;">📞 ${o.tel}</div>
                    <div style="font-size:12px; color:#888; background:#FDFBFA; padding:8px; border-radius:10px; border: 1px solid #F0E6D8;">🏠 地址/備註: ${o.rem || '無'}</div>
                    <div style="margin:10px 0;">${o.items.map(it => `<div style="font-size:13px;">• ${it.name} x${it.qty} <span style="color:#D4A373;">($${it.price})</span></div>`).join('')}</div>
                    <div style="text-align:right; font-weight:bold; color:var(--red); font-size:16px;">總額: $${total}</div>
                    <button onclick="showTemplate(${ri})" style="background:var(--green); font-size:12px; margin-top:10px; border-radius:10px;">📋 生成通知文案 (含付款資料)</button>
                </div>`;
            }).join('');
        }

        function showTemplate(idx) {
            const o = orders[idx];
            const total = o.items.reduce((s, it) => s + (it.price * it.qty), 0);
            const template = `【SlowOver 訂購確認】✨
感謝你的支持！以下是你的訂單詳情：

📌 訂單編號：${o.id}
📅 訂購日期：${new Date(o.date).toLocaleDateString()}

📦 訂購項目：
${o.items.map(it => `- ${it.name} x${it.qty} ($${it.price})`).join('\n')}

💰 總金額：HKD $${total}
📍 收件資訊/備註：${o.rem || '（請提供收件地址/入盒要求）'}

----------------------------
付款資料 📄
1. 麻煩在24小時內完成付款並回傳入數證明（截圖/入數紙）
2. 請在入數證明上備註電話號碼，緊記保留作證明
3. 確認付款後會發送確認訂單訊息
4. 收到確認訂單訊息後請再三核對訂單內容（產品內容/款式/數量），所有訂單一經確認後不可取消或更改，如未能成功購買，會全數退款
5. 請考慮清楚先落單，棄單將會當黑名單處理
6. 所有產品寄出前均會檢查，運送風險需由買家承擔。
7. 貨到日期受物流影響或有誤差，敬請見諒。

*記得完成付款後發送CAP圖給我們*
----------------------------
請核對以上資料，如確認無誤請回覆「OK」，謝謝！🙏`;

            document.getElementById('copy-area').value = template;
            document.getElementById('copy-modal').style.display = 'flex';
        }

        function copyToClipboard() {
            const area = document.getElementById('copy-area');
            area.select(); area.setSelectionRange(0, 99999);
            document.execCommand('copy');
            alert('文案已成功複製到剪貼簿！');
            closeModal();
        }

        function closeModal() { document.getElementById('copy-modal').style.display = 'none'; }
        function switchPage(p, btn) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            btn.classList.add('active');
            if(p === 'buy') renderBuy();
        }

        function renderBuy() {
            let sum = {};
            orders.forEach(o => o.items.forEach(it => { if(!it.bought) { sum[it.name] = (sum[it.name] || 0) + it.qty; } }));
            const sorted = Object.keys(sum).sort();
            document.getElementById('buy-summary').innerHTML = sorted.map(n => `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #F0E6D8;"><b>${n}</b><span style="color:var(--red); font-weight:bold;">x${sum[n]}</span></div>`).join('') || "<div style='text-align:center; padding:20px; color:#CCC;'>✅ 已全部買齊！</div>";
        }
    </script>
</body>
</html>
