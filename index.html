<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V135</title>
    <style>
        :root { 
            --bg: #F9FAFC; --card: #FFFFFF; --primary: #2B5CE7; --success: #34C759; 
            --warning: #FF9500; --danger: #FF3B30; --text-main: #1C1C1E; --text-sub: #8E8E93;
            --border: #F2F2F7; --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text-main); margin: 0; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }

        /* 同步提示 */
        #sync-btn { position: fixed; top: calc(15px + env(safe-area-inset-top)); right: 20px; background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 11px; z-index: 3000; display: none; }

        /* Header */
        header { padding: calc(40px + env(safe-area-inset-top)) 20px 10px; background: var(--bg); position: sticky; top:0; z-index: 100; }
        header h1 { font-size: 24px; margin: 0; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .sub-header { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

        /* 卡片與列表 (IMG_9684 Style) */
        .card { background: var(--card); border-radius: 14px; padding: 16px; margin: 0 20px 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-id { font-weight: 800; font-size: 15px; }
        .card-preview { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
        .tag-sm { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #EEE; display: inline-flex; align-items: center; gap: 3px; }
        .tag-unpaid { color: var(--warning); border-color: var(--warning); background: #FFF9F2; }
        .tag-paid { color: var(--success); border-color: var(--success); background: #F2FBF4; }

        /* 導航欄 */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.98); backdrop-filter: blur(20px); border-top: 0.5px solid #DDD; display: flex; padding-bottom: env(safe-area-inset-bottom); height: calc(65px + env(safe-area-inset-bottom)); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #8E8E93; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 22px; margin-bottom: 4px; }

        /* 按鈕樣式 */
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: #F2F2F7; color: var(--text-main); }
        
        /* 批量輸入區 (IMG_9686) */
        #batch-input-area { width: 100%; height: 250px; background: #F9F9F9; border: 1px solid var(--border); border-radius: 12px; padding: 15px; font-size: 13px; margin-bottom: 20px; }

        /* 全屏覆蓋層 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: none; overflow-y: auto; padding-bottom: 100px; }
        .overlay-header { padding: calc(45px + env(safe-area-inset-top)) 20px 15px; display: flex; align-items: center; justify-content: space-between; background: white; border-bottom: 0.5px solid #EEE; position: sticky; top:0; }
    </style>
</head>
<body>

    <button id="sync-btn" onclick="pushChanges()">☁️ 同步更新</button>

    <div id="page-order" class="page active">
        <header>
            <h1>訂單管理 <span style="font-size:18px;">🔍</span></h1>
            <div class="sub-header" id="order-count">共 0 張訂單</div>
        </header>
        <div id="order-list"></div>
    </div>

    <div id="page-import" class="page">
        <header><h1>批量輸入訂單</h1></header>
        <div style="padding: 20px;">
            <textarea id="batch-input-area" placeholder="格式：電話 商品 數量 售價 (每行一條)&#10;60001111 日本代購 1 100"></textarea>
            <button class="btn btn-p" onclick="processBatch()">確認並產生單號</button>
        </div>
    </div>

    <div id="detail-overlay" class="overlay">
        <div class="overlay-header">
            <button onclick="closeOverlay()" style="border:none; background:none; color:var(--primary); font-weight:800;">〈 返回</button>
            <div id="dt-id" style="font-weight:800;">詳情</div>
            <div>✏️</div>
        </div>
        <div id="dt-body" style="padding: 20px;"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('order', this)"><span>🏠</span>訂單</div>
        <div class="nav-item" onclick="nav('import', this)"><span>📄</span>導入</div>
        <div class="nav-item" onclick="nav('buy', this)"><span>🛒</span>採購</div>
        <div class="nav-item" onclick="nav('stats', this)"><span>📊</span>統計</div>
        <div class="nav-item" onclick="nav('settings', this)"><span>⚙️</span>設定</div>
    </nav>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyxqLpZAXpxEMeAXQAMeJwM0fm2eOfVr5cvA-bdN8CGDG_vHPY40hWMa-YxbTfWrXeOag/exec"; 
        let rawData = [], config = {}, pendingChanges = [];

        async function sync() {
            const r = await fetch(`${API}?t=${Date.now()}`);
            config = await r.json(); rawData = config.orders;
            render();
        }

        function render() {
            const grouped = rawData.reduce((acc, o) => { acc[o.id] = acc[o.id] || { ...o, items: [] }; acc[o.id].items.push(o); return acc; }, {});
            const orders = Object.values(grouped).reverse();
            document.getElementById('order-count').innerText = `共 ${orders.length} 張訂單`;
            
            document.getElementById('order-list').innerHTML = orders.map(o => `
                <div class="card" onclick="openDetail('${o.id}')">
                    <div style="display:flex; justify-content:space-between;">
                        <span class="card-id">${o.id}</span>
                        <span class="tag-sm ${o.paid?'tag-paid':'tag-unpaid'}">${o.paid?'已付':'未付'}</span>
                    </div>
                    <div class="card-preview">${o.items.map(i=>`${i.name}×${i.qty}`).join(', ')}</div>
                </div>
            `).join('');
        }

        function openDetail(id) {
            const its = rawData.filter(r => r.id === id); const o = its[0];
            const total = its.reduce((s,i)=>s+(i.price*i.qty),0);
            
            // 對賬文案 (IMG_9692)
            const reconText = `【${config.company} 對賬文案】\n單號：${id}\n電話：${o.tel}\n金額：HK$${total}\n付款方式：PayMe/FPS\n請於24小時內完成付款。`;

            document.getElementById('dt-body').innerHTML = `
                <button class="btn btn-p" onclick="copyToClipboard('${reconText}')">📋 複製對賬文案</button>
                <div class="card" style="margin:20px 0; background:#F2FBF4;">
                    <label>付款狀態</label>
                    <div style="font-size:18px; font-weight:800; color:var(--success);">${o.paid?'✅ 已收全額':'⏳ 待付款'}</div>
                </div>
                <h3>商品清單</h3>
                ${its.map(it => `
                    <div style="padding:15px 0; border-bottom:1px solid #EEE;">
                        <b>${it.name}</b> <span style="float:right;">x${it.qty}</span>
                        <div style="color:var(--text-sub); font-size:12px;">單價: HK$${it.price}</div>
                    </div>
                `).join('')}
            `;
            document.getElementById('detail-overlay').style.display = 'block';
        }

        async function processBatch() {
            const lines = document.getElementById('batch-input-area').value.split('\n').filter(l => l.trim());
            const newOrders = [];
            let currentS = config.serial;
            
            lines.forEach(line => {
                const parts = line.split(/\s+/);
                if(parts.length >= 4) {
                    const id = `WS26APR${String(currentS).padStart(3, '0')}`;
                    newOrders.push({
                        id, tel: parts[0], date: new Date().toISOString(),
                        items: [{ name: parts[1], qty: parseInt(parts[2]), price: parseFloat(parts[3]) }]
                    });
                    currentS++;
                }
            });

            await fetch(API, {method:'POST', body:JSON.stringify({type:'SAVE_BATCH', orders:newOrders})});
            alert("成功導入！");
            sync();
            nav('order', document.querySelector('.nav-item'));
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => alert("已複製到剪貼簿"));
        }

        function nav(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active'); el.classList.add('active');
        }

        function closeOverlay() { document.getElementById('detail-overlay').style.display = 'none'; }
        window.onload = sync;
    </script>
</body>
</html>
