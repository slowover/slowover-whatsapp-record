<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V101</title>
    <style>
        :root { 
            --bg: #FAF7F2; --card: #FFFFFF; --text: #5F4B32; 
            --primary: #D4A373; --important: #A64444; 
            --btn-green: #588157; --paid-bg: #D4A373; --unpaid-bg: #E9E4DE;
        }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            padding: calc(15px + env(safe-area-inset-top)) 15px calc(100px + env(safe-area-inset-bottom)) 15px;
            -webkit-tap-highlight-color: transparent; 
        }

        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); display:none; justify-content:center; align-items:center; z-index:9999; backdrop-filter: blur(4px); font-weight: bold; color: var(--primary); }
        
        .card { background: var(--card); padding: 18px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(95,75,50,0.08); border: 1px solid #F0EAE2; }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #EEE; z-index: 1000; }
        .nav-item { flex: 1; padding: 18px 0; text-align: center; font-size: 13px; font-weight: bold; color: #BBB; }
        .nav-item.active { color: var(--primary); }
        
        .page { display: none; max-width: 600px; margin: 0 auto; } 
        .page.active { display: block; }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #E0D7CC; border-radius: 12px; font-size: 16px; background: #FFF; outline: none; box-sizing: border-box; }
        
        button { border-radius: 12px; border: none; padding: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-sync { background: var(--primary); color: white; width: 100%; margin-bottom: 15px; }
        .btn-save { background: var(--text); color: white; width: 100%; font-size: 16px; margin-top: 10px; }

        .editable-label { border-bottom: 1px dashed #CCC; cursor: pointer; padding: 2px 0; display: inline-block; }
        .item-box { background: #FDFBFA; padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #F0EAE2; position: relative; }
        .btn-del-item { position: absolute; right: 8px; top: 8px; color: #CCC; font-size: 12px; padding: 5px; }

        .btn-buy-toggle { padding: 6px 12px; font-size: 11px; border-radius: 8px; min-width: 65px; }
        .btn-whatsapp { background: var(--btn-green); color: white; width: 100%; margin-top: 15px; font-size: 14px; }
        
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #EEE; font-size: 14px; }
    </style>
</head>
<body>

    <div id="loading">☕ 正在處理中...</div>
    <button class="btn-sync" onclick="syncFromCloud()">🔄 立即同步雲端數據</button>

    <div id="page-order" class="page active">
        <div class="card" style="border: 2px solid var(--primary);">
            <h3 style="margin:0 0 10px 0;">📝 新增訂單</h3>
            <div style="display:flex; gap:8px;">
                <input type="text" id="order-id" placeholder="單號" style="flex:1.5;">
                <input type="date" id="order-date" style="flex:1;">
            </div>
            <input type="tel" id="cust-tel" placeholder="客戶電話">
            <div id="new-items-area"></div>
            <button onclick="addInputRow()" style="background:#F0EAE2; width:100%; color:var(--text); margin-bottom:12px;">+ 增加商品項目</button>
            <textarea id="order-rem" placeholder="📍 地址 / 備註"></textarea>
            <div style="text-align:right; margin:10px 0; font-size:20px;">總額: <span style="color:var(--important); font-weight:bold;" id="total-display">$0</span></div>
            <button class="btn-save" onclick="saveOrder()">💾 儲存訂單</button>
        </div>
        <input type="text" id="search-order" placeholder="🔍 搜尋電話、單號、商品..." oninput="renderOrders()" style="margin-bottom:15px;">
        <div id="order-list"></div>
    </div>

    <div id="page-buy" class="page">
        <div class="card">
            <h3 style="margin:0 0 10px 0;">🛍️ 採購篩選</h3>
            <div style="display:flex; gap:8px; margin-bottom:10px;">
                <select id="buy-filter-paid" onchange="renderBuy()" style="flex:1;"><option value="all">所有付款</option><option value="paid">✅ 已付</option><option value="unpaid">⏳ 未付</option></select>
                <select id="buy-filter-status" onchange="renderBuy()" style="flex:1;"><option value="unbought">❌ 未買</option><option value="bought">📦 已買</option><option value="all">所有購買</option></select>
            </div>
            <input type="text" id="search-buy" placeholder="🔍 搜尋商品、電話、單號..." oninput="renderBuy()">
        </div>
        <div id="buy-summary"></div>
    </div>

    <div id="page-stats" class="page">
        <div class="card" style="display:flex; justify-content:space-around; text-align:center;">
            <div>利潤<br><span style="color:var(--important); font-size:22px; font-weight:bold;" id="stat-profit">$0</span></div>
            <div>成本<br><span id="stat-cost">$0</span></div>
            <div>營業額<br><span id="stat-rev">$0</span></div>
        </div>
        <div id="stat-list"></div>
    </div>

    <div id="page-settings" class="page">
        <div class="card">
            <h3>💹 匯率助手 (兌換 HKD)</h3>
            <div class="stat-row"><span>韓幣 KRW (1000)</span> <input type="number" id="rate-krw" value="5.8" style="width:80px; margin:0;"></div>
            <div class="stat-row"><span>日圓 JPY (100)</span> <input type="number" id="rate-jpy" value="5.2" style="width:80px; margin:0;"></div>
            <div class="stat-row"><span>美元 USD</span> <input type="number" id="rate-usd" value="7.8" style="width:80px; margin:0;"></div>
            <div class="stat-row"><span>歐羅 EUR</span> <input type="number" id="rate-eur" value="8.5" style="width:80px; margin:0;"></div>
        </div>
        <div class="card">
            <h3>🔢 單號管理</h3>
            <label style="font-size:12px;">下一個流水號</label>
            <input type="number" id="manual-serial">
            <button onclick="updateSerial()" style="background:var(--primary); color:white; width:100%; margin-top:10px;">更新流水號</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchPage('order', this)">📝 訂單</div>
        <div class="nav-item" onclick="switchPage('buy', this)">🛍️ 採購</div>
        <div class="nav-item" onclick="switchPage('stats', this)">📊 統計</div>
        <div class="nav-item" onclick="switchPage('settings', this)">⚙️ 設定</div>
    </nav>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec"; 
        let rawData = [], serial = 402;

        // 生成單號：WS + 26 + 月份縮寫 + 流水號
        function getOrderNum(s) {
            const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            const d = new Date();
            return `WS26${months[d.getMonth()]}${s}`;
        }

        async function syncFromCloud() {
            document.getElementById('loading').style.display = 'flex';
            try {
                const r = await fetch(GAS_URL + "?t=" + Date.now());
                const res = await r.json();
                rawData = res.orders || [];
                serial = res.nextSerial || 402;
                document.getElementById('manual-serial').value = serial;
                if(!document.getElementById('order-id').value) document.getElementById('order-id').value = getOrderNum(serial);
                renderOrders();
            } catch(e) { console.error(e); }
            finally { document.getElementById('loading').style.display = 'none'; }
        }

        async function updateField(rowIdx, field, val) {
            if(val === null || val === undefined) return;
            document.getElementById('loading').style.display = 'flex';
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'UPDATE_FIELD', rowIdx, field, val}) });
            await syncFromCloud();
        }

        function renderOrders() {
            const list = document.getElementById('order-list');
            const q = document.getElementById('search-order').value.toLowerCase();
            const grouped = {};
            
            // 倒序排列，最新在最上
            const sorted = [...rawData].reverse();

            sorted.forEach(r => {
                if(r.tel.includes(q) || r.id.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)) {
                    if(!grouped[r.id]) grouped[r.id] = { ...r, items: [] };
                    grouped[r.id].items.push(r);
                }
            });

            list.innerHTML = Object.values(grouped).map(o => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="font-size:12px; color:#AAA;">#${o.id}</span>
                        <button class="btn-pay-status ${o.paid?'status-paid':'status-unpaid'}" 
                                onclick="updateField(${o.items[0].rowIdx}, 'paid', '${o.paid?'⏳未付':'✅已付'}')">
                            ${o.paid?'✅ 已付':'⏳ 未付'}
                        </button>
                    </div>
                    <b class="editable-label" onclick="updateField(${o.items[0].rowIdx}, 'tel', prompt('修改電話', '${o.tel}'))">📞 ${o.tel}</b><br>
                    <small class="editable-label" style="color:#888; margin-top:5px;" onclick="updateField(${o.items[0].rowIdx}, 'rem', prompt('修改地址/備註', '${o.rem}'))">📍 ${o.rem || '無備註'}</small>
                    <div style="margin-top:12px; border-top:1px solid #EEE; padding-top:10px;">
                        ${o.items.map(it => `
                            <div class="item-box">
                                <span class="btn-del-item" onclick="if(confirm('確定刪除此商品？')) updateField(${it.rowIdx}, 'name', 'DELETE_ROW')">🗑️</span>
                                <div class="editable-label" onclick="updateField(${it.rowIdx}, 'name', prompt('修改品名', '${it.name}'))"><b>${it.name}</b></div>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                                    <span style="font-size:14px;">
                                        <span class="editable-label" onclick="updateField(${it.rowIdx}, 'qty', prompt('修改數量', '${it.qty}'))">x${it.qty}</span> 
                                        (<span class="editable-label" onclick="updateField(${it.rowIdx}, 'price', prompt('修改售價', '${it.price}'))">$${it.price}</span>)
                                    </span>
                                    <button class="btn-buy-toggle" 
                                            style="background:${it.bought?'var(--btn-green)':'#F0F0F0'}; color:${it.bought?'white':'#999'};"
                                            onclick="updateField(${it.rowIdx}, 'bought', '${it.bought?'❌未買':'✅已買'}')">
                                        ${it.bought?'已買':'未買'}
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-whatsapp" onclick="generateMsg('${o.id}')">📋 複製出單通知</button>
                </div>
            `).join('');
        }

        function renderBuy() {
            const q = document.getElementById('search-buy').value.toLowerCase();
            const fPaid = document.getElementById('buy-filter-paid').value;
            const fStatus = document.getElementById('buy-filter-status').value;
            const buyMap = {};

            rawData.forEach(r => {
                const matchQ = r.name.toLowerCase().includes(q) || r.tel.includes(q) || r.id.toLowerCase().includes(q);
                const matchP = (fPaid==='all') || (fPaid==='paid' && r.paid) || (fPaid==='unpaid' && !r.paid);
                const matchS = (fStatus==='all') || (fStatus==='bought' && r.bought) || (fStatus==='unbought' && !r.bought);

                if(matchQ && matchP && matchS) {
                    if(!buyMap[r.name]) buyMap[r.name] = { total: 0, custs: [] };
                    buyMap[r.name].total += r.qty;
                    buyMap[r.name].custs.push(r);
                }
            });

            document.getElementById('buy-summary').innerHTML = Object.keys(buyMap).map(name => `
                <div class="card" style="border-left:5px solid var(--primary);">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <b>📦 ${name}</b> <span style="color:var(--important); font-weight:bold;">x${buyMap[name].total}</span>
                    </div>
                    ${buyMap[name].custs.map(c => `
                        <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:5px; background:#F9F7F5; padding:8px; border-radius:8px;">
                            <span>${c.tel} (x${c.qty}) <small style="color:#AAA;">#${c.id}</small></span>
                            <button onclick="updateField(${c.rowIdx}, 'bought', '✅已買')" style="background:var(--primary); color:white; padding:4px 8px; border-radius:5px; font-size:10px;">標記已買</button>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        function renderStats() {
            let rev=0, cost=0;
            const html = rawData.map(it => {
                const itemTotal = it.price * it.qty;
                const itemCost = it.cost * it.qty;
                rev += itemTotal; cost += itemCost;
                return `<div class="card">
                    <div style="display:flex; justify-content:space-between;"><b>${it.name}</b> <span>$${itemTotal}</span></div>
                    <div class="stat-row" style="border:none; margin-top:5px;">
                        <span style="color:#999;">成本: <input type="number" value="${it.cost}" style="width:60px; padding:2px; margin:0;" onchange="updateField(${it.rowIdx}, 'cost', this.value)"></span>
                        <span style="color:var(--btn-green); font-weight:bold;">利潤: $${itemTotal - itemCost}</span>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('stat-rev').innerText = `$${rev}`;
            document.getElementById('stat-cost').innerText = `$${cost}`;
            document.getElementById('stat-profit').innerText = `$${rev-cost}`;
            document.getElementById('stat-list').innerHTML = html;
        }

        function generateMsg(id) {
            const its = rawData.filter(r => r.id === id);
            const o = its[0];
            const total = its.reduce((s, it) => s + (it.price*it.qty), 0);
            const d = new Date(o.date);
            const cleanDate = `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;

            const msg = `【SlowOver 訂購確認】✨\n\n📌 訂單編號：${o.id}\n📅 訂購日期：${cleanDate}\n📦 訂購項目：\n${its.map(it => `- ${it.name} x${it.qty} ($${it.price})`).join('\n')}\n\n💰 總金額：HKD $${total}\n📍 地址/備註：${o.rem || "無"}\n\n----------------------------\n💸 付款方式：\nPayMe：\nhttps://qr.payme.hsbc.com.hk/2/Ui316pJ5T8b428yzTSbr4J\n\n快速支付系統識別碼 FPS ID：105249023\n名稱：slow over\n\n⚠️ 注意事項：\n下單即同意以下條款：\n1. 24小時內完成付款並回傳入數截圖。\n2. 截圖請備註或訊息電話號碼以便對賬。\n3. 訂單一經確認，不設取消、退換或更改。\n4. 如遇商品缺貨，將會全數退款。\n5. 一般預訂需時 7-30 個工作天，不接急單。\n6. 運送過程如有損壞風險需由買家承擔。\n7. SLOWOVER 保留最終決定權。\n\n感謝支持 SLOWOVER！`;
            
            const el = document.createElement('textarea');
            el.value = msg; document.body.appendChild(el);
            el.select(); document.execCommand('copy');
            document.body.removeChild(el);
            alert("✅ 出單文案已複製");
        }

        function switchPage(p, btn) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            btn.classList.add('active');
            if(p==='buy') renderBuy();
            if(p==='stats') renderStats();
        }

        function addInputRow() {
            const d = document.createElement('div'); d.className = 'item-box';
            d.innerHTML = `<input type="text" class="i-n" placeholder="品名" style="width:100%"><div style="display:flex; gap:8px; margin-top:5px;"><input type="number" class="i-q" value="1" style="flex:1" placeholder="數量"><input type="number" class="i-p" placeholder="售價" style="flex:2" oninput="calcTotal()"></div>`;
            document.getElementById('new-items-area').appendChild(d);
        }

        function calcTotal() {
            let t = 0; document.querySelectorAll('.item-box').forEach(r => {
                const q = r.querySelector('.i-q')?.value || 0;
                const p = r.querySelector('.i-p')?.value || 0;
                t += (q * p);
            });
            document.getElementById('total-display').innerText = `$${t}`;
        }

        async function saveOrder() {
            const id = document.getElementById('order-id').value;
            const tel = document.getElementById('cust-tel').value;
            const date = document.getElementById('order-date').value;
            if(!id || !tel) return alert("請填寫單號及電話");
            let its = [];
            document.querySelectorAll('#new-items-area .item-box').forEach(r => {
                const n = r.querySelector('.i-n').value;
                if(n) its.push({ name: n, qty: parseInt(r.querySelector('.i-q').value), price: parseFloat(r.querySelector('.i-p').value) });
            });
            document.getElementById('loading').style.display = 'flex';
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'UPDATE_SINGLE', order: {id, date, tel, rem: document.getElementById('order-rem').value, items: its}, nextSerial: serial+1}) });
            location.reload();
        }

        async function updateSerial() {
            const ns = document.getElementById('manual-serial').value;
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'UPDATE_SERIAL', nextSerial: parseInt(ns)}) });
            syncFromCloud();
        }

        window.onload = () => { 
            document.getElementById('order-date').valueAsDate = new Date(); 
            addInputRow(); 
            syncFromCloud(); 
        };
    </script>
</body>
</html>
