<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V112</title>
    <style>
        :root { --bg: #F8F5F2; --card: #FFF; --text: #5D4037; --primary: #D4A373; --accent: #A64444; --green: #6B8E23; --blue: #5D8AA8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
        
        /* iPhone 貼合修復 */
        .page { display: none; padding: 15px; width: 100%; max-width: 500px; margin: 0 auto; }
        .page.active { display: block; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #FFF; display: flex; border-top: 1px solid #EEE; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .nav-item { flex: 1; padding: 12px 0; text-align: center; font-size: 11px; color: #AAA; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        
        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); width: 100%; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-box { background: var(--card); padding: 12px; border-radius: 10px; text-align: center; border-bottom: 3px solid var(--primary); }
        .stat-box h4 { margin: 0; font-size: 11px; color: #888; }
        .stat-box p { margin: 3px 0 0 0; font-size: 16px; font-weight: bold; }

        .item-line { font-size: 13px; color: #666; background: #F9F9F9; padding: 4px 8px; border-radius: 4px; margin-top: 4px; }
        .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; margin-right: 4px; display: inline-block; }
        .bg-unpaid { background: #BBB; } .bg-paid { background: var(--primary); }
        
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #DDD; border-radius: 8px; font-size: 16px; margin-top: 5px; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-p { background: var(--primary); color: white; }
        .btn-s { background: #F2F2F2; color: #666; }

        /* 詳情頁全屏遮罩 */
        #detail-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #F8F5F2; z-index: 2000; display: none; overflow-y: auto; padding: 20px 15px; padding-top: env(safe-area-inset-top); }
        .back-btn { background: none; border: none; font-size: 16px; color: var(--primary); font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; }
        
        .progress-bar-bg { background: #EEE; border-radius: 10px; height: 6px; margin: 8px 0; }
        .progress-bar-fill { background: var(--green); height: 100%; border-radius: 10px; transition: width 0.3s; }
    </style>
</head>
<body>

    <div id="sync-toast" style="position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.6); color:#fff; padding:4px 12px; border-radius:20px; font-size:12px; display:none; z-index:3000;">同步中...</div>

    <div id="page-stats" class="page active">
        <select id="stat-month" onchange="renderStats()"></select>
        <div class="stat-grid" style="margin-top:12px;">
            <div class="stat-box"><h4>訂單 (已付/總數)</h4><p id="s-count">0/0</p></div>
            <div class="stat-box"><h4>營業額 (已收/總額)</h4><p id="s-rev">$0</p></div>
            <div class="stat-box"><h4>總成本</h4><p id="s-cost">$0</p></div>
            <div class="stat-box"><h4>純利</h4><p id="s-profit">$0</p></div>
        </div>
        <div id="stat-items"></div>
    </div>

    <div id="page-order" class="page">
        <div class="card">
            <h3>登記新單</h3>
            <input type="tel" id="new-tel" placeholder="客戶電話">
            <div id="new-items"></div>
            <button class="btn btn-s" style="margin-top:10px;" onclick="addNewItemRow()">+ 增加商品</button>
            <button class="btn btn-p" style="margin-top:10px;" onclick="saveNewOrder()">儲存訂單</button>
        </div>
        <input type="text" id="search-order" placeholder="🔍 搜尋電話/單號/品名..." oninput="renderOrders()">
        <div id="order-list" style="margin-top:12px;"></div>
    </div>

    <div id="page-buy" class="page">
        <div class="card" style="text-align:center; background: var(--primary); color:white;">
            <h2 id="buy-pending-count" style="margin:0;">0</h2>
            <p style="margin:0; font-size:12px;">待採購商品總數</p>
        </div>
        <div id="buy-list"></div>
    </div>

    <div id="page-settings" class="page">
        <div class="card">
            <h3>單號及基礎設定</h3>
            <input type="number" id="cfg-serial" placeholder="起始編號">
            <button class="btn btn-s" onclick="saveConfig()">更新</button>
        </div>
        <div class="card">
            <h3>批量匯入</h3>
            <textarea id="batch-input" rows="3" placeholder="電話 商品x數量 價格"></textarea>
            <button class="btn btn-p" onclick="importBatch()">立即匯入</button>
        </div>
        <div class="card">
            <h3>付款資料</h3>
            <input type="text" id="cfg-payme" placeholder="PayMe 連結">
            <input type="text" id="cfg-fps-id" placeholder="FPS ID">
            <input type="text" id="cfg-fps-name" placeholder="名稱">
            <textarea id="cfg-terms" rows="3" placeholder="條款"></textarea>
            <button class="btn btn-p" onclick="saveConfig()">儲存所有</button>
        </div>
    </div>

    <div id="detail-overlay">
        <button class="back-btn" onclick="closeDetail()">‹ 返回</button>
        <div id="detail-content"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item" onclick="switchPage('order', this)">📝 訂單</div>
        <div class="nav-item" onclick="switchPage('buy', this)">🛍️ 採購</div>
        <div class="nav-item active" onclick="switchPage('stats', this)">📊 統計</div>
        <div class="nav-item" onclick="switchPage('settings', this)">⚙️ 設定</div>
    </nav>

    <script>
        const GAS_URL = "你的_GAS_網址";
        let rawData = [], config = {};

        async function sync() {
            document.getElementById('sync-toast').style.display = 'block';
            try {
                const r = await fetch(GAS_URL + "?t=" + Date.now());
                rawData = (await r.json()).orders;
                config = await (await fetch(GAS_URL + "?t=" + Date.now())).json(); // 再次獲取完整 config
                updateUI();
            } finally { document.getElementById('sync-toast').style.display = 'none'; }
        }

        function updateUI() {
            renderStats(); renderOrders(); renderBuy();
            document.getElementById('cfg-serial').value = config.serial;
            document.getElementById('cfg-payme').value = config.payme;
            document.getElementById('cfg-fps-id').value = config.fpsId;
            document.getElementById('cfg-fps-name').value = config.fpsName;
            document.getElementById('cfg-terms').value = config.terms;
        }

        function renderOrders() {
            const container = document.getElementById('order-list');
            const q = document.getElementById('search-order').value.toLowerCase();
            const grouped = {};
            rawData.forEach(r => {
                if(!grouped[r.id]) grouped[r.id] = { ...r, items: [] };
                grouped[r.id].items.push(r);
            });
            let list = Object.values(grouped).sort((a,b) => b.rowIdx - a.rowIdx);
            if(q) list = list.filter(o => o.tel.includes(q) || o.id.toLowerCase().includes(q) || o.items.some(i => i.name.toLowerCase().includes(q)));

            container.innerHTML = list.map(o => `
                <div class="card" onclick="openDetail('${o.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>📞 ${o.tel}</b>
                        <span class="badge ${o.paid?'bg-paid':'bg-unpaid'}">${o.paid?'已付':'未付'}</span>
                    </div>
                    <div style="margin-top:8px;">
                        ${o.items.map(i => `<div class="item-line">${i.name} x${i.qty}</div>`).join('')}
                    </div>
                </div>
            `).join('');
        }

        function openDetail(id) {
            const its = rawData.filter(r => r.id === id);
            const o = its[0];
            const total = its.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('detail-content').innerHTML = `
                <div class="card">
                    <p style="margin:0; font-size:12px; color:#999;">單號 #${o.id}</p>
                    <h2 style="margin:5px 0;">${o.tel}</h2>
                    <button class="btn btn-p" onclick="updateOrderField('${o.id}', 'paid', '${o.paid?'⏳未付':'✅已付'}')">付款：${o.paid?'✅已收':'⏳未收'}</button>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;">
                        <button class="btn btn-s" onclick="updateOrderField('${o.id}', 'arrived', '${o.arrived?'❌未到':'✅已到'}')">到貨：${o.arrived?'✅':'❌'}</button>
                        <button class="btn btn-s" onclick="updateOrderField('${o.id}', 'shipped', '${o.shipped?'❌未出':'✅已出'}')">出貨：${o.shipped?'✅':'❌'}</button>
                    </div>
                </div>
                <h3>商品明細 (點擊可編輯)</h3>
                ${its.map(it => `
                    <div class="card" style="border-left: 4px solid var(--primary);">
                        <div onclick="editItemDetail(${it.rowIdx}, '${it.name}', ${it.qty}, ${it.price})">
                            <b>${it.name}</b><br>
                            <span style="color:var(--accent); font-weight:bold;">$${it.price} x ${it.qty}</span>
                        </div>
                        <button class="btn btn-s" style="margin-top:8px; font-size:12px; padding:6px;" onclick="updateItemField(${it.rowIdx}, 'bought', '${it.bought?'❌未買':'✅已買'}')">
                            採購狀態：${it.bought?'✅已買':'❌未買'}
                        </button>
                    </div>
                `).join('')}
                <div style="text-align:right; font-size:18px; font-weight:bold; margin-top:10px;">總計：$${total}</div>
                <button class="btn btn-p" style="margin-top:15px;" onclick="copyNotify('${o.id}')">📋 複製出單通知</button>
            `;
            document.getElementById('detail-overlay').style.display = 'block';
        }

        async function editItemDetail(rowIdx, oldName, oldQty, oldPrice) {
            const newName = prompt("更改商品名稱", oldName);
            if(!newName) return;
            const newQty = prompt("更改數量", oldQty);
            const newPrice = prompt("更改價錢", oldPrice);
            await updateItemField(rowIdx, 'name', newName);
            await updateItemField(rowIdx, 'qty', newQty);
            await updateItemField(rowIdx, 'price', newPrice);
            const id = rawData.find(r => r.rowIdx === rowIdx).id;
            openDetail(id);
        }

        function renderBuy() {
            const summary = {};
            let pendingTotal = 0;
            rawData.forEach(r => {
                if(!summary[r.name]) summary[r.name] = { total: 0, bought: 0, orders: [] };
                summary[r.name].total += r.qty;
                if(r.bought) summary[r.name].bought += r.qty;
                else pendingTotal += r.qty;
                summary[r.name].orders.push(r);
            });
            document.getElementById('buy-pending-count').innerText = pendingTotal;
            document.getElementById('buy-list').innerHTML = Object.entries(summary).map(([name, data]) => `
                <div class="card">
                    <b>${name}</b>
                    <div style="font-size:12px; color:#888; margin:4px 0;">總需：${data.total} | 已買：${data.bought} | 待買：${data.total - data.bought}</div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${(data.bought/data.total)*100}%"></div></div>
                    <details>
                        <summary style="font-size:12px; color:var(--primary);">查看訂單</summary>
                        ${data.orders.map(o => `
                            <div style="display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid #EEE;">
                                <span>${o.tel} (x${o.qty})</span>
                                <button onclick="updateItemField(${o.rowIdx}, 'bought', '${o.bought?'❌未買':'✅已買'}')" style="border:none; background:none; color:${o.bought?'var(--green)':'#CCC'}">
                                    ${o.bought?'✅ 已買':'❌ 未買'}
                                </button>
                            </div>
                        `).join('')}
                    </details>
                </div>
            `).join('');
        }

        function renderStats() {
            const monthSelect = document.getElementById('stat-month');
            const months = [...new Set(rawData.map(r => r.date.substring(0, 7)))].sort().reverse();
            if(monthSelect.options.length === 0) months.forEach(m => monthSelect.add(new Option(m, m)));
            const sel = monthSelect.value;
            const filtered = rawData.filter(r => r.date.startsWith(sel));
            
            let paidCount = new Set(filtered.filter(r => r.paid).map(r => r.id)).size;
            let totalCount = new Set(filtered.map(r => r.id)).size;
            let paidRev = 0, totalRev = 0, cost = 0;
            
            filtered.forEach(r => {
                totalRev += (r.price * r.qty);
                cost += (r.cost * r.qty);
                if(r.paid) paidRev += (r.price * r.qty);
            });

            document.getElementById('s-count').innerText = `${paidCount}/${totalCount}`;
            document.getElementById('s-rev').innerText = `$${paidRev}/$${totalRev}`;
            document.getElementById('s-cost').innerText = `$${cost}`;
            document.getElementById('s-profit').innerText = `$${paidRev - cost}`;

            const items = {};
            filtered.forEach(r => {
                if(!items[r.name]) items[r.name] = { cost: r.cost, rowIdx: r.rowIdx };
            });
            document.getElementById('stat-items').innerHTML = `<h3>商品成本設定</h3>` + Object.entries(items).map(([n, d]) => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <span>${n}</span>
                    <input type="number" value="${d.cost}" style="width:80px; margin:0;" onchange="updateItemField(${d.rowIdx}, 'cost', this.value)">
                </div>
            `).join('');
        }

        async function updateOrderField(id, field, val) {
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'UPDATE_FIELD', orderId: id, field, val }) });
            await sync(); openDetail(id);
        }
        async function updateItemField(rowIdx, field, val) {
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ type: 'UPDATE_FIELD', rowIdx, field, val }) });
            await sync();
        }
        function closeDetail() { document.getElementById('detail-overlay').style.display = 'none'; }
        function switchPage(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active'); el.classList.add('active');
        }
        function addNewItemRow() {
            const div = document.createElement('div');
            div.className = 'card'; div.style.background = "#F9F9F9";
            div.innerHTML = `<input type="text" class="ni-n" placeholder="品名"><div style="display:flex; gap:5px;"><input type="number" class="ni-q" value="1"><input type="number" class="ni-p" placeholder="售價"></div>`;
            document.getElementById('new-items').appendChild(div);
        }
        window.onload = () => { sync(); addNewItemRow(); };
    </script>
</body>
</html>
