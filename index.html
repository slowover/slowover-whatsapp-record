<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SlowOver CRM V97</title>
    <style>
        :root { 
            --bg: #FAF7F2; --card: #FFFFFF; --text: #5F4B32; 
            --primary: #D4A373; --important: #A64444; 
            --btn-green: #588157; --btn-gray: #A5A5A5;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px 10px 120px 10px; }
        .card { background: var(--card); padding: 16px; border-radius: 18px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(95,75,50,0.08); border: 1px solid #F0EAE2; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid #EEE; z-index: 1000; }
        .nav-item { flex: 1; padding: 15px 0; text-align: center; font-size: 12px; font-weight: bold; color: #BBB; }
        .nav-item.active { color: var(--primary); }
        .page { display: none; max-width: 600px; margin: 0 auto; } .page.active { display: block; }
        input, textarea, select { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #E0D7CC; border-radius: 12px; font-size: 14px; background: #FFF; color: var(--text); outline: none; box-sizing: border-box; }
        button { border-radius: 12px; border: none; padding: 12px; font-weight: bold; cursor: pointer; }
        .btn-sync { background: var(--primary); color: white; margin-bottom: 12px; width: 100%; opacity: 0.9; }
        .btn-save { background: var(--text); color: white; width: 100%; font-size: 16px; }
        .important-text { color: var(--important); font-weight: bold; }
        .btn-whatsapp { background: var(--btn-green); color: white; width: 100%; margin-top: 10px; font-size: 13px; }
        
        /* 採購頁專用排版 */
        .filter-pill-box { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .filter-pill { background: #EEE; padding: 8px 16px; border-radius: 20px; font-size: 12px; white-space: nowrap; transition: 0.3s; }
        .filter-pill.active { background: var(--primary); color: white; }
        .buy-item-card { border-left: 6px solid var(--primary); }
        .buy-cust-row { background: #F9F7F5; padding: 10px; border-radius: 10px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }

        .editable-field { border-bottom: 1px dashed #CCC; cursor: pointer; transition: 0.2s; }
        .editable-field:hover { background: #FFF9F0; }
        #loading { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); display:none; justify-content:center; align-items:center; z-index:9999; backdrop-filter: blur(4px); }
    </style>
</head>
<body>

    <div id="loading">☕ 正在處理中...</div>
    <button class="btn-sync" onclick="syncFromCloud()">🔄 同步雲端最新資料</button>

    <div id="page-order" class="page active">
        <div class="card" style="border: 2px solid var(--primary);">
            <h3 style="margin:0 0 10px 0; font-size:18px;">📝 新增訂單</h3>
            <div style="display:flex; gap:8px;">
                <input type="text" id="order-id" placeholder="單號" style="flex:1">
                <input type="date" id="order-date" style="flex:1">
            </div>
            <input type="tel" id="cust-tel" placeholder="客戶電話">
            <div id="new-items-area"></div>
            <button onclick="addInputRow()" style="background:#F0EAE2; width:100%; color:var(--text); margin-bottom:10px;">+ 增加商品</button>
            <textarea id="order-rem" placeholder="📍 地址 / 備註"></textarea>
            <div style="text-align:right; margin:10px 0;">總額: <span class="important-text" id="total-display" style="font-size:20px;">$0</span></div>
            <button class="btn-save" onclick="saveOrder()">💾 儲存訂單</button>
        </div>
        <div class="card">
            <input type="text" id="search-order" placeholder="🔍 搜尋電話、商品、單號..." oninput="renderOrders()">
        </div>
        <div id="order-list"></div>
    </div>

    <div id="page-buy" class="page">
        <div class="card">
            <h3 style="margin:0 0 15px 0;">🛍️ 採購清單</h3>
            <div class="filter-pill-box">
                <div class="filter-pill active" id="p-unbought" onclick="togglePill('unbought')">❌ 未買</div>
                <div class="filter-pill active" id="p-paid" onclick="togglePill('paid')">✅ 已付</div>
                <div class="filter-pill active" id="p-unpaid" onclick="togglePill('unpaid')">⏳ 未付</div>
                <div class="filter-pill" id="p-bought" onclick="togglePill('bought')">📦 已買</div>
            </div>
            <input type="text" id="search-buy" placeholder="🔍 搜尋特定商品..." oninput="renderBuy()">
        </div>
        <div id="buy-summary"></div>
    </div>

    <div id="page-stats" class="page">
        <div class="card" style="display:flex; justify-content:space-around; text-align:center; background:#FDFBFA;">
            <div>利潤<br><span class="important-text" style="font-size:22px;" id="stat-profit">$0</span></div>
            <div>成本<br><span id="stat-cost">$0</span></div>
            <div>營業額<br><span id="stat-rev">$0</span></div>
        </div>
        <div id="stat-list"></div>
    </div>

    <div id="page-fx" class="page">
        <div class="card">
            <h3>💹 匯率設定</h3>
            <select id="fx-from" onchange="renderFXInputs()"><option value="GBP">GBP</option><option value="JPY">JPY</option><option value="KRW">KRW</option><option value="EUR">EUR</option><option value="USD">USD</option></select>
            <div id="rates-inputs"></div>
            <label style="font-size:12px;">手續費加成 %</label><input type="number" id="fx-fee" step="0.1">
            <button class="btn-save" onclick="saveFX()">💾 儲存</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchPage('order', this)">📝 訂單</div>
        <div class="nav-item" onclick="switchPage('buy', this)">🛍️ 採購</div>
        <div class="nav-item" onclick="switchPage('stats', this)">📊 統計</div>
        <div class="nav-item" onclick="switchPage('fx', this)">💹 匯率</div>
    </nav>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxPcskRvFZoka0kzvUo7zcj7qQOkwt2QGVIvdJf6R_-iQl9somIDcFtstCFJujAIP-o/exec";
        let rawData = [], settings = {}, serial = 402;
        let filters = { paid: true, unpaid: true, bought: false, unbought: true };

        async function syncFromCloud() {
            document.getElementById('loading').style.display = 'flex';
            const r = await fetch(GAS_URL + "?t=" + Date.now());
            const res = await r.json();
            rawData = res.orders; serial = res.nextSerial; settings = res.settings;
            renderOrders(); renderFXInputs(); renderStats(); renderBuy();
            document.getElementById('loading').style.display = 'none';
        }

        function togglePill(type) {
            filters[type] = !filters[type];
            document.getElementById('p-' + type).classList.toggle('active');
            renderBuy();
        }

        function renderOrders() {
            const list = document.getElementById('order-list');
            const search = document.getElementById('search-order').value.toLowerCase();
            
            const sorted = [...rawData].sort((a,b) => {
                if (a.paid !== b.paid) return b.paid - a.paid;
                if (a.paid && b.paid) return a.payTime - b.payTime;
                return b.rowIdx - a.rowIdx;
            });

            const grouped = {};
            sorted.forEach(r => {
                if(r.tel.includes(search) || r.name.toLowerCase().includes(search) || r.id.toLowerCase().includes(search)) {
                    if(!grouped[r.id]) grouped[r.id] = { ...r, items: [] };
                    grouped[r.id].items.push(r);
                }
            });

            list.innerHTML = Object.values(grouped).map(o => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                        <span style="font-size:11px; color:#999;">#${o.id}</span>
                        <button style="padding:4px 12px; font-size:11px; border-radius:20px; background:${o.paid?'#D4A373':'#EEE'}; color:${o.paid?'white':'#999'};" 
                                onclick="updateField(${o.items[0].rowIdx}, 'paid', '${o.paid?'⏳未付':'✅已付'}')">
                            ${o.paid?'✅ 已付':'⏳ 未付'}
                        </button>
                    </div>
                    <div style="margin-bottom:8px;">
                        <b class="editable-field" onclick="editPrompt(${o.items[0].rowIdx}, 'tel', '${o.tel}', '修改電話')">📞 ${o.tel}</b>
                    </div>
                    <div class="editable-field" style="font-size:12px; color:#777; margin-bottom:12px;" onclick="editPrompt(${o.items[0].rowIdx}, 'rem', '${o.rem}', '修改備註')">
                        📍 ${o.rem || '無備註 (點擊新增)'}
                    </div>
                    <div style="border-top:1px solid #F5F0EB; padding-top:10px;">
                        ${o.items.map(it => `
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                <span class="editable-field" style="font-size:14px; flex:1;" onclick="editPrompt(${it.rowIdx}, 'name', '${it.name}', '修改品名')">${it.name} x${it.qty}</span>
                                <button onclick="updateField(${it.rowIdx}, 'bought', '${it.bought?false:true}')" 
                                        style="background:${it.bought? 'var(--btn-green)':'#EEE'}; color:${it.bought?'white':'#999'}; font-size:11px; padding:6px 12px; border-radius:10px;">
                                    ${it.bought?'已買':'未買'}
                                </button>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn-whatsapp" onclick="generateMsg('${o.id}')">📋 複製出單通知</button>
                </div>
            `).join('');
        }

        function renderBuy() {
            const search = document.getElementById('search-buy').value.toLowerCase();
            let filtered = rawData.filter(r => {
                const matchSearch = r.name.toLowerCase().includes(search);
                const matchPaid = (r.paid && filters.paid) || (!r.paid && filters.unpaid);
                const matchBought = (r.bought && filters.bought) || (!r.bought && filters.unbought);
                return matchSearch && matchPaid && matchBought;
            });

            const buyMap = {};
            filtered.forEach(r => {
                if(!buyMap[r.name]) buyMap[r.name] = { total: 0, custs: [] };
                buyMap[r.name].total += r.qty;
                buyMap[r.name].custs.push(r);
            });

            document.getElementById('buy-summary').innerHTML = Object.keys(buyMap).map(name => `
                <div class="card buy-item-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <b style="font-size:16px;">📦 ${name}</b>
                        <span class="important-text" style="font-size:18px;">x${buyMap[name].total}</span>
                    </div>
                    ${buyMap[name].custs.map(c => `
                        <div class="buy-cust-row">
                            <span style="font-size:13px;">${c.tel} <small style="color:#AAA;">(${c.paid?'已付':'未付'})</small></span>
                            <button onclick="updateField(${c.rowIdx}, 'bought', '${c.bought?false:true}')" 
                                    style="padding:5px 12px; font-size:11px; border-radius:8px; background:${c.bought?'var(--btn-green)':'#DDD'}; color:white;">
                                ${c.bought?'已買':'未買'}
                            </button>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        async function editPrompt(rowIdx, field, oldVal, title) {
            const newVal = prompt(title, oldVal);
            if(newVal !== null && newVal !== oldVal) {
                await updateField(rowIdx, field, newVal);
            }
        }

        async function updateField(rowIdx, field, val) {
            document.getElementById('loading').style.display = 'flex';
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({type:'UPDATE_FIELD', rowIdx, field, val}) });
            await syncFromCloud();
        }

        // --- 其餘功能模塊 (與 V96 邏輯一致，僅 UI 優化) ---
        function addInputRow() {
            const d = document.createElement('div'); d.className = 'item-row';
            d.innerHTML = `<div style="display:flex; gap:5px;"><input type="text" class="i-n" placeholder="品名" style="flex:2"><input type="number" class="i-q" value="1" style="flex:0.5"><input type="number" class="i-p" placeholder="售價" style="flex:1"></div>`;
            document.getElementById('new-items-area').appendChild(d);
        }

        function switchPage(p, btn) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.page').forEach(e => e.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            btn.classList.add('active');
            if(p==='buy') renderBuy();
            if(p==='stats') renderStats();
        }

        function renderStats() {
            let rev=0, cost=0;
            const html = rawData.map(it => {
                rev += it.price * it.qty; cost += it.cost * it.qty;
                return `<div class="card" style="padding:10px; margin-bottom:8px; font-size:13px;">
                    <div style="display:flex; justify-content:space-between;"><b>${it.name}</b> <span>$${it.price}</span></div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                        <span style="color:#999;">成本: <input type="number" value="${it.cost}" style="width:60px; padding:2px; margin:0;" onchange="updateField(${it.rowIdx}, 'cost', this.value)"></span>
                        <span class="important-text">利: $${(it.price - it.cost)*it.qty}</span>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('stat-rev').innerText = `$${rev}`;
            document.getElementById('stat-cost').innerText = `$${cost}`;
            document.getElementById('stat-profit').innerText = `$${rev-cost}`;
            document.getElementById('stat-list').innerHTML = html;
        }

        // 初始化
        window.onload = () => { document.getElementById('order-date').valueAsDate = new Date(); addInputRow(); syncFromCloud(); };
    </script>
</body>
</html>
