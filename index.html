<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SlowOver CRM V160</title>
    <style>
        :root { --bg: #F9FAFC; --primary: #2B5CE7; --success: #34C759; --warning: #FF9500; --danger: #FF3B30; --text-sub: #8E8E93; --border: #F2F2F7; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); margin: 0; padding-bottom: 90px; color: #1C1C1E; }
        
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        header { padding: calc(40px + env(safe-area-inset-top)) 0 15px; }
        header h1 { font-size: 26px; margin: 0; font-weight: 800; }

        .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        /* 狀態標籤 */
        .tag-group { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
        .tag { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #EEE; }
        .t-paid { color: var(--success); border-color: var(--success); }
        .t-unpaid { color: var(--warning); border-color: var(--warning); }
        
        /* 進度條 (Buying Page) */
        .progress-container { background: #EEE; border-radius: 10px; height: 8px; margin: 10px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; transition: 0.3s; }

        /* 導航欄 */
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; border-top: 0.5px solid #DDD; display: flex; padding-bottom: env(safe-area-inset-bottom); height: 75px; z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-sub); font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 22px; margin-bottom: 4px; }

        input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-top: 8px; font-size: 15px; }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-p { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <div id="page-order" class="page active">
        <header><h1>訂單管理</h1></header>
        <div id="order-list"></div>
    </div>

    <div id="page-customer" class="page">
        <header><h1>新增訂單</h1></header>
        <div class="card">
            <label>電話號碼</label><input type="tel" id="input-tel" placeholder="輸入電話">
            <label style="display:block; margin-top:15px;">商品內容 (格式：品名 數量 售價)</label>
            <textarea id="input-items" rows="5" placeholder="例如：&#10;Miffy Keyring 1 150&#10;NB Breeze 1 1199"></textarea>
            <button class="btn btn-p" onclick="createNewOrder()">確認提交</button>
        </div>
    </div>

    <div id="page-buy" class="page">
        <header><h1>採購進度</h1></header>
        <div id="buy-list"></div>
    </div>

    <div id="page-stats" class="page">
        <header><h1>營運數據</h1></header>
        <div id="stat-summary" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;"></div>
        <h3>成本輸入</h3>
        <div id="cost-input-list"></div>
    </div>

    <div id="page-remind" class="page">
        <header><h1>24h 催付提醒</h1></header>
        <div id="remind-list"></div>
    </div>

    <div id="page-settings" class="page">
        <header><h1>系統設定</h1></header>
        <div id="settings-info"></div>
        <div class="card">
            <label>手動更新下次單號</label>
            <input type="number" id="manual-serial">
            <button class="btn btn-p" onclick="updateSerial()">更新單號</button>
        </div>
    </div>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="nav('order', this)"><span>🏠</span>訂單</div>
        <div class="nav-item" onclick="nav('customer', this)"><span>➕</span>新增</div>
        <div class="nav-item" onclick="nav('buy', this)"><span>🛒</span>採購</div>
        <div class="nav-item" onclick="nav('stats', this)"><span>📊</span>統計</div>
        <div class="nav-item" onclick="nav('remind', this)"><span>🔔</span>提醒</div>
        <div class="nav-item" onclick="nav('settings', this)"><span>⚙️</span>設定</div>
    </nav>

    <script>
        const API = "https://script.google.com/macros/s/AKfycbyxqLpZAXpxEMeAXQAMeJwM0fm2eOfVr5cvA-bdN8CGDG_vHPY40hWMa-YxbTfWrXeOag/exec";
        let rawData = [], config = {};

        async function sync() {
            const res = await fetch(`${API}?t=${Date.now()}`);
            config = await res.json();
            rawData = config.orders;
            renderAll();
        }

        function renderAll() {
            renderOrders();
            renderBuyPage();
            renderStatsPage();
            renderReminders();
            renderSettingsPage();
        }

        // 1. 訂單頁面 (顯示電話與各類狀態)
        function renderOrders() {
            const grouped = groupById(rawData);
            document.getElementById('order-list').innerHTML = grouped.map(o => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; font-weight:800;">
                        <span>${o.id}</span>
                        <span style="color:var(--primary);">HK$${o.total}</span>
                    </div>
                    <div style="font-size:13px; margin:5px 0;">📞 ${o.tel}</div>
                    <div style="font-size:12px; color:#666;">${o.items.map(i => i.name).join(' / ')}</div>
                    <div class="tag-group">
                        <span class="tag ${o.paid?'t-paid':'t-unpaid'}">${o.paid?'已付':'未付'}</span>
                        <span class="tag">${o.allBought?'全買':'欠貨'}</span>
                        <span class="tag">${o.allArrived?'全到':'未齊'}</span>
                        <span class="tag">${o.allShipped?'已出貨':'未發貨'}</span>
                    </div>
                </div>
            `).join('');
        }

        // 2. 新增訂單邏輯
        async function createNewOrder() {
            const tel = document.getElementById('input-tel').value;
            const itemsRaw = document.getElementById('input-items').value.split('\n');
            const items = [];
            itemsRaw.forEach(line => {
                const p = line.trim().split(/\s+/);
                if(p.length >= 3) items.push({ name: p[0], qty: parseInt(p[1]), price: parseFloat(p[2]) });
            });
            
            const newId = `WS26APR${String(config.serial).padStart(3, '0')}`;
            const payload = { type: 'SAVE_BATCH', orders: [{ id: newId, tel, items }], nextSerial: config.serial + 1 };
            
            await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
            alert("訂單已建立：" + newId);
            location.reload();
        }

        // 3. 採購頁面 (進度條)
        function renderBuyPage() {
            const products = {};
            rawData.forEach(o => {
                products[o.name] = products[o.name] || { total: 0, bought: 0 };
                products[o.name].total += o.qty;
                if(o.bought) products[o.name].bought += o.qty;
            });

            document.getElementById('buy-list').innerHTML = Object.keys(products).map(name => {
                const p = products[name];
                const percent = (p.bought / p.total * 100) || 0;
                return `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; font-weight:bold;">
                            <span>${name}</span>
                            <span>${p.bought} / ${p.total}</span>
                        </div>
                        <div class="progress-container"><div class="progress-bar" style="width:${percent}%"></div></div>
                        <div style="font-size:11px; color:var(--text-sub);">剩餘需買: ${p.total - p.bought}</div>
                    </div>
                `;
            }).join('');
        }

        // 4. 統計頁面 (利潤分析)
        function renderStatsPage() {
            const totalRev = rawData.reduce((s,o)=>s+(o.price*o.qty), 0);
            const totalCost = rawData.reduce((s,o)=>s+(o.cost*o.qty), 0);
            const profit = totalRev - totalCost;
            const profitPercent = (profit / totalRev * 100).toFixed(1);

            document.getElementById('stat-summary').innerHTML = `
                <div class="card" style="margin:0;"><div style="font-size:11px;">總銷售額</div><div style="font-size:18px; font-weight:800;">HK$${totalRev}</div></div>
                <div class="card" style="margin:0;"><div style="font-size:11px;">利潤 (${profitPercent}%)</div><div style="font-size:18px; font-weight:800; color:var(--success);">HK$${profit}</div></div>
            `;

            // 成本輸入列表
            const prodList = {};
            rawData.forEach(o => {
                prodList[o.name] = prodList[o.name] || { totalQty: 0, cost: o.cost };
                prodList[o.name].totalQty += o.qty;
            });

            document.getElementById('cost-input-list').innerHTML = Object.keys(prodList).map(name => {
                const p = prodList[name];
                return `
                    <div class="card">
                        <div style="font-weight:bold;">${name} (總量: ${p.totalQty})</div>
                        <div style="display:flex; gap:10px; align-items:center; margin-top:5px;">
                            <input type="number" id="cost-${name}" value="${p.cost}" style="margin:0; flex:1;" placeholder="輸入成本">
                            <button onclick="updateCost('${name}')" style="background:var(--success); color:white; border:none; padding:10px; border-radius:8px;">儲存</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateCost(name) {
            const cost = document.getElementById(`cost-${name}`).value;
            await fetch(API, { method: 'POST', body: JSON.stringify({ type: 'UPDATE_COST', productName: name, cost: parseFloat(cost) }) });
            alert("成本已更新");
            sync();
        }

        // 5. 提醒頁面 (24小時催付)
        function renderReminders() {
            const now = Date.now();
            const unpaid = groupById(rawData).filter(o => !o.paid && (now - o.timestamp > 24 * 60 * 60 * 1000));
            
            document.getElementById('remind-list').innerHTML = unpaid.map(o => `
                <div class="card" style="border-left:5px solid var(--danger);">
                    <div style="font-weight:bold;">${o.id} - 逾期未付</div>
                    <div style="font-size:13px; color:#666;">電話: ${o.tel} | 金額: HK$${o.total}</div>
                    <button class="btn btn-light" style="padding:8px; font-size:12px;" onclick="copyReminder('${o.id}', ${o.total})">複製催付文案</button>
                </div>
            `).join('') || '<p style="text-align:center; color:gray;">目前沒有逾期訂單</p>';
        }

        // 6. 設定頁面
        function renderSettingsPage() {
            const grouped = groupById(rawData);
            const paidCount = grouped.filter(o => o.paid).length;
            document.getElementById('settings-info').innerHTML = `
                <div class="card">
                    <div>總訂單數: ${grouped.length}</div>
                    <div style="color:var(--success);">已付款: ${paidCount}</div>
                    <div style="color:var(--danger);">未付款: ${grouped.length - paidCount}</div>
                    <hr>
                    <div style="font-size:13px; color:var(--text-sub);">當前單號: ${config.serial}</div>
                </div>
            `;
            document.getElementById('manual-serial').value = config.serial;
        }

        function groupById(data) {
            const g = data.reduce((acc, o) => {
                acc[o.id] = acc[o.id] || { ...o, items: [], total: 0 };
                acc[o.id].items.push(o);
                acc[o.id].total += (o.price * o.qty);
                return acc;
            }, {});
            return Object.values(g).map(o => ({
                ...o,
                allBought: o.items.every(i => i.bought),
                allArrived: o.items.every(i => i.arrived),
                allShipped: o.items.every(i => i.shipped)
            }));
        }

        function nav(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(ni => ni.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            el.classList.add('active');
        }

        window.onload = sync;
    </script>
</body>
</html>
