<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlowOver CRM V91.70 TableSync</title>
    </head>
<body>
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyx9esL5EBvlrswdoxfgY9dwIgmjNbd9kkpsfZCzSk5kfIs7CcYDz-lAc8f2h2jt4f9OA/exec";
        let orders = [], serial = 402, settings = {rate:10.2, from:'GBP', fee:0};

        // 核心：從表格讀取並修正日期格式
        async function syncFromCloud() {
            try {
                const r = await fetch(GAS_URL + "?t=" + Date.now());
                const res = await r.json();
                if(res) {
                    orders = res.orders.map(o => {
                        // 修正：將表格讀到的日期轉為 YYYY-MM-DD
                        if(o.date) o.date = new Date(o.date).toISOString().split('T')[0];
                        return o;
                    });
                    serial = res.nextSerial;
                    if(res.settings) settings = res.settings;
                    render();
                }
            } catch(e) { console.error("同步出錯", e); }
            document.getElementById('loading-lock').style.display = 'none';
        }

        // 核心：儲存訂單到表格
        async function saveOrder() {
            const tel = document.getElementById('cust-tel').value;
            const rem = document.getElementById('order-rem').value;
            let its = [];
            document.querySelectorAll('.item-row').forEach(r => {
                const n = r.querySelector('.i-n').value;
                if(n) its.push({
                    name: n, 
                    qty: parseInt(r.querySelector('.i-q').value) || 1, 
                    price: parseFloat(r.querySelector('.i-p').value) || 0, 
                    cost: 0, 
                    bought: false, 
                    arrived: false
                });
            });

            if(!tel || its.length === 0) return alert("資料不足");

            const newO = { 
                id: `WS26JAN${serial}`, // 根據你截圖的編號格式調整
                date: document.getElementById('order-date').value, 
                tel, 
                rem, 
                items: its, 
                paid: false 
            };

            orders.push(newO);
            serial++; // 流水號遞增
            render();

            // 推送到 GAS 寫入表格
            await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify({type: 'UPDATE_SINGLE', order: newO, nextSerial: serial})
            });

            // 重置輸入框
            document.getElementById('cust-tel').value = "";
            document.getElementById('order-rem').value = "";
            document.getElementById('new-items-area').innerHTML = "";
            addInputRow();
        }

        // 其餘功能 (render, copyMsg, quickFX) 保持之前邏輯...
    </script>
</body>
</html>
